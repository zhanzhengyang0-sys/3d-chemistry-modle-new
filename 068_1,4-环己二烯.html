<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>1,4-环己二烯 · 点击 H 换成彩球 · 光滑球面</title>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: white;
            touch-action: none;
            position: fixed;
            width: 100%; height: 100%;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            font-family: Arial, 'Segoe UI', sans-serif;
        }
        canvas { display: block; touch-action: none; }

        #touch-hint {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #ddd;
            font-size: 12px;
            color: #555;
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            max-width: calc(100vw - 24px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #controls {
            position: absolute;
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            max-width: calc(100vw - 16px);
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid #ccc;
            border-radius: 22px;
            padding: 8px 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 12px;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            pointer-events: auto;
        }

        .color-picker {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .picker-label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            white-space: nowrap;
        }
        .color-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            transition: transform 0.12s, box-shadow 0.15s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        .color-dot:active { transform: scale(0.88); }
        .color-dot.active {
            border: 3px solid #1a1a1a;
            transform: scale(1.12);
            box-shadow: 0 0 0 2px #ffd966;
        }

        .divider-vertical {
            width: 1px;
            height: 30px;
            background: #d0d0d0;
            flex-shrink: 0;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding: 4px 6px;
            touch-action: manipulation;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .checkbox-label {
            font-size: 13px;
            color: #333;
            font-weight: 600;
            pointer-events: none;
        }
        .checkbox-custom {
            width: 20px;
            height: 20px;
            border: 2px solid #888;
            border-radius: 3px;
            background-color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            flex-shrink: 0;
            box-sizing: border-box;
            pointer-events: none;
        }
        .checkbox-custom.checked {
            background-color: #1a2b5c;
            border-color: #1a2b5c;
        }
        .checkbox-custom.checked::after {
            content: '';
            display: block;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) translate(-1px, -1px);
        }

        @media (pointer: coarse) {
            .color-dot { width: 34px; height: 34px; }
            .checkbox-custom { width: 24px; height: 24px; }
            .checkbox-label { font-size: 14px; }
            .checkbox-container { padding: 8px 8px; }
            #controls { padding: 10px 14px; }
        }

        @media (max-width: 720px) {
            #controls {
                width: calc(100vw - 16px);
                padding: 10px 12px;
                gap: 8px;
                border-radius: 18px;
            }
            .color-picker {
                width: 100%;
                justify-content: center;
                padding-bottom: 8px;
                border-bottom: 1px solid #eee;
            }
            .color-dots { gap: 8px; }
            .divider-vertical { display: none; }
            .checkbox-container {
                width: 100%;
                justify-content: center;
            }
            #touch-hint { font-size: 11px; padding: 4px 12px; top: 12px; }
        }

        @media (max-width: 420px) {
            #controls { padding: 8px 10px; }
            .color-dot { width: 28px; height: 28px; }
            .color-dots { gap: 6px; }
            .checkbox-label { font-size: 13px; }
        }
    </style>
    <script src="libs/three.min.js"></script>
    <script src="libs/OrbitControls.js"></script>
</head>
<body>
    <div id="touch-hint">👆 点击氢原子 → 变为所选颜色球 · 再点变回氢</div>

    <div id="controls">
        <div class="color-picker">
            <span class="picker-label">H →</span>
            <div class="color-dots">
                <div class="color-dot active" data-color="red"    title="红色" style="background:#ff4444;"></div>
                <div class="color-dot" data-color="yellow" title="黄色" style="background:#ffcc00;"></div>
                <div class="color-dot" data-color="green"  title="绿色" style="background:#44dd88;"></div>
                <div class="color-dot" data-color="blue"   title="蓝色" style="background:#2196f3;"></div>
                <div class="color-dot" data-color="purple" title="紫色" style="background:#9b59b6;"></div>
                <div class="color-dot" data-color="black"  title="黑色" style="background:#000000;"></div>
            </div>
        </div>

        <div class="divider-vertical"></div>

        <label class="checkbox-container">
            <span class="checkbox-label">隐藏 H / 彩球</span>
            <div class="checkbox-custom" id="hideCheckbox"></div>
        </label>
    </div>

    <script>
        // ============================================================
        // 基础场景
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.2, -7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.domElement.style.touchAction = 'none';
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.target.set(0, 0, 0);
        controls.minPolarAngle = 0;
        controls.maxPolarAngle = Math.PI;

        // --- 光源（保留原 3 个） ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        const l1 = new THREE.DirectionalLight(0xffffff, 1);
        l1.position.set(2, 3, 2);
        scene.add(l1);

        const l2 = new THREE.DirectionalLight(0xffffff, 0.5);
        l2.position.set(-2, 2, -2);
        scene.add(l2);

        const l3 = new THREE.PointLight(0xffffff, 0.3);
        l3.position.set(1, -1, 3);
        scene.add(l3);

        // ============================================================
        // 几何计算（保持原值）
        // ============================================================
        const CH_BOND_LENGTH = 0.95;
        const DOUBLE_BOND = 1.34;
        const SINGLE_BOND = 1.50;

        const c4 = new THREE.Vector3(-DOUBLE_BOND / 2, -0.2, -0.8);
        const c5 = new THREE.Vector3( DOUBLE_BOND / 2, -0.2, -0.8);
        const c3 = new THREE.Vector3(-1.5, 0.6, -0.2);
        const c6 = new THREE.Vector3( 1.5, 0.6, -0.2);
        const c2 = new THREE.Vector3(-DOUBLE_BOND / 2, -0.2, 0.8);
        const c1 = new THREE.Vector3( DOUBLE_BOND / 2, -0.2, 0.8);

        let carbons = [c1, c2, c3, c4, c5, c6];
        const center = new THREE.Vector3().addVectors(c2, c5).multiplyScalar(0.5);
        carbons.forEach(c => c.sub(center));

        const [newC1, newC2, newC3, newC4, newC5, newC6] = carbons;

        const n1 = new THREE.Vector3().crossVectors(
            new THREE.Vector3().subVectors(newC2, newC1),
            new THREE.Vector3().subVectors(newC3, newC1)
        ).normalize();

        const n2 = new THREE.Vector3().crossVectors(
            new THREE.Vector3().subVectors(newC5, newC4),
            new THREE.Vector3().subVectors(newC3, newC4)
        ).normalize();

        function sp2H(c, neighbor1, neighbor2, normal) {
            const d1 = new THREE.Vector3().subVectors(neighbor1, c).normalize();
            const d2 = new THREE.Vector3().subVectors(neighbor2, c).normalize();
            const bis = new THREE.Vector3().addVectors(d1, d2).normalize().negate();
            const dir = bis.sub(normal.clone().multiplyScalar(bis.dot(normal))).normalize();
            return c.clone().add(dir.multiplyScalar(CH_BOND_LENGTH));
        }

        const h1 = sp2H(newC1, newC2, newC6, n1);
        const h2 = sp2H(newC2, newC1, newC3, n1);
        const h4 = sp2H(newC4, newC5, newC3, n2);
        const h5 = sp2H(newC5, newC4, newC6, n2);

        const v32 = new THREE.Vector3().subVectors(newC2, newC3).normalize();
        const v34 = new THREE.Vector3().subVectors(newC4, newC3).normalize();
        const sum12 = new THREE.Vector3().addVectors(v32, v34);
        const sum34 = sum12.clone().negate();
        const u = sum34.clone().normalize();

        let perp = new THREE.Vector3(1, 0, 0);
        if (Math.abs(u.dot(perp)) > 0.99) perp = new THREE.Vector3(0, 1, 0);
        const axis = new THREE.Vector3().crossVectors(u, perp).normalize();

        const angle = 54.75 * Math.PI / 180;
        const h3aDir = u.clone().applyAxisAngle(axis, angle).normalize();
        const h3bDir = u.clone().applyAxisAngle(axis, -angle).normalize();
        const h3a = newC3.clone().add(h3aDir.multiplyScalar(CH_BOND_LENGTH));
        const h3b = newC3.clone().add(h3bDir.multiplyScalar(CH_BOND_LENGTH));

        const v61 = new THREE.Vector3().subVectors(newC1, newC6).normalize();
        const v65 = new THREE.Vector3().subVectors(newC5, newC6).normalize();
        const sum12_6 = new THREE.Vector3().addVectors(v61, v65);
        const sum34_6 = sum12_6.clone().negate();
        const u6 = sum34_6.clone().normalize();

        let perp6 = new THREE.Vector3(1, 0, 0);
        if (Math.abs(u6.dot(perp6)) > 0.99) perp6 = new THREE.Vector3(0, 1, 0);
        const axis6 = new THREE.Vector3().crossVectors(u6, perp6).normalize();
        const h6aDir = u6.clone().applyAxisAngle(axis6, angle).normalize();
        const h6bDir = u6.clone().applyAxisAngle(axis6, -angle).normalize();
        const h6a = newC6.clone().add(h6aDir.multiplyScalar(CH_BOND_LENGTH));
        const h6b = newC6.clone().add(h6bDir.multiplyScalar(CH_BOND_LENGTH));

        const hydrogens = [h1, h2, h3a, h3b, h4, h5, h6a, h6b];
        const hParentIndex = [0, 1, 2, 2, 3, 4, 5, 5];
        const carbonArr = [newC1, newC2, newC3, newC4, newC5, newC6];

        // ============================================================
        // 原子半径
        // ============================================================
        const RADII = { C: 0.28, H: 0.18, colored: 0.22 };

        const carbonMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.3 });
        const hydrogenMat = new THREE.MeshStandardMaterial({ color: 0x00008B, roughness: 0.4 });
        const bondMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 });

        const COLOR_VALUES = {
            red:    0xff4444,
            yellow: 0xffcc00,
            green:  0x44dd88,
            blue:   0x2196f3,
            purple: 0x9b59b6,
            black:  0x000000
        };
        const coloredMaterials = {};
        Object.keys(COLOR_VALUES).forEach(key => {
            coloredMaterials[key] = new THREE.MeshStandardMaterial({
                color: COLOR_VALUES[key], roughness: 0.35, metalness: 0.1
            });
        });

        // ============================================================
        // ★★★ 关键修改：球体几何体分段数大幅提高，实现完美光滑球面 ★★★
        //   原值：碳 20×10、氢 16×8、彩球 16×8（多边形感明显）
        //   新值：统一 64×48（约 3000 三角形/球，肉眼完全光滑）
        // ============================================================
        const SPHERE_SEGMENTS_W = 64;   // 水平分段
        const SPHERE_SEGMENTS_H = 48;   // 垂直分段

        const sphereGeomC       = new THREE.SphereGeometry(RADII.C,       SPHERE_SEGMENTS_W, SPHERE_SEGMENTS_H);
        const sphereGeomH       = new THREE.SphereGeometry(RADII.H,       SPHERE_SEGMENTS_W, SPHERE_SEGMENTS_H);
        const sphereGeomColored = new THREE.SphereGeometry(RADII.colored, SPHERE_SEGMENTS_W, SPHERE_SEGMENTS_H);

        // --- 圆柱键辅助函数（适当提高径向分段数，让键的圆柱侧面也更光滑） ---
        function createSingleBond(p1, p2) {
            const dir = new THREE.Vector3().subVectors(p2, p1);
            const len = dir.length();
            const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            const dirNorm = dir.clone().normalize();
            const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, len, 24, 1), bondMat);
            cyl.position.copy(mid);
            cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirNorm);
            return cyl;
        }

        function createDoubleBond(p1, p2) {
            const dir = new THREE.Vector3().subVectors(p2, p1);
            const len = dir.length();
            const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            const dirNorm = dir.clone().normalize();

            let perp = new THREE.Vector3(1, 0, 0);
            if (Math.abs(dirNorm.dot(perp)) > 0.99) perp.set(0, 0, 1);
            const off = new THREE.Vector3().crossVectors(dirNorm, perp).normalize().multiplyScalar(0.10);

            const cyl1 = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, len, 24, 1), bondMat);
            cyl1.position.copy(mid.clone().add(off));
            cyl1.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirNorm);
            scene.add(cyl1);

            const cyl2 = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, len, 24, 1), bondMat);
            cyl2.position.copy(mid.clone().sub(off));
            cyl2.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirNorm);
            scene.add(cyl2);
        }

        // ============================================================
        // 构建 C-C 骨架
        // ============================================================
        const ccBonds = [
            [newC1, newC2, true],
            [newC2, newC3, false],
            [newC3, newC4, false],
            [newC4, newC5, true],
            [newC5, newC6, false],
            [newC6, newC1, false]
        ];
        ccBonds.forEach(([p1, p2, isDouble]) => {
            if (isDouble) createDoubleBond(p1, p2);
            else scene.add(createSingleBond(p1, p2));
        });

        // --- 碳原子球 ---
        carbonArr.forEach(pos => {
            const sphere = new THREE.Mesh(sphereGeomC, carbonMat);
            sphere.position.copy(pos);
            scene.add(sphere);
        });

        // ============================================================
        // 可替换原子管理
        // ============================================================
        const clickableAtoms = [];
        const switchableAtoms = [];

        hydrogens.forEach((hPos, idx) => {
            const cIdx = hParentIndex[idx];
            const cPos = carbonArr[cIdx];

            const hMesh = new THREE.Mesh(sphereGeomH, hydrogenMat);
            hMesh.position.copy(hPos);
            scene.add(hMesh);
            clickableAtoms.push(hMesh);

            const bond = createSingleBond(cPos, hPos);
            scene.add(bond);

            switchableAtoms.push({
                mesh: hMesh,
                bond,
                cPos: cPos.clone(),
                hPos: hPos.clone(),
                type: 'H',
                colorKey: null
            });
        });

        // ============================================================
        // 隐藏 H / 彩球
        // ============================================================
        const hideCheckbox = document.getElementById('hideCheckbox');
        let isHidden = false;

        function toggleHydrogen(hide) {
            isHidden = hide;
            switchableAtoms.forEach(rec => {
                rec.mesh.visible = !hide;
                rec.bond.visible = !hide;
            });
            hideCheckbox.classList.toggle('checked', hide);
        }

        document.querySelector('.checkbox-container').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleHydrogen(!isHidden);
        });

        // ============================================================
        // 颜色选择器
        // ============================================================
        let selectedColorKey = 'red';
        const colorDots = document.querySelectorAll('.color-dot');
        colorDots.forEach(dot => {
            dot.addEventListener('click', () => {
                selectedColorKey = dot.dataset.color;
                colorDots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
            });
        });

        // ============================================================
        // 原子替换
        // ============================================================
        function swapAtom(record, newType, colorKey) {
            scene.remove(record.mesh);
            scene.remove(record.bond);

            const ci = clickableAtoms.indexOf(record.mesh);
            if (ci > -1) clickableAtoms.splice(ci, 1);

            let newMesh;
            if (newType === 'H') {
                newMesh = new THREE.Mesh(sphereGeomH, hydrogenMat);
            } else {
                newMesh = new THREE.Mesh(sphereGeomColored, coloredMaterials[colorKey]);
            }
            newMesh.position.copy(record.hPos);
            newMesh.visible = !isHidden;
            scene.add(newMesh);
            clickableAtoms.push(newMesh);

            const newBond = createSingleBond(record.cPos, record.hPos);
            newBond.visible = !isHidden;
            scene.add(newBond);

            record.mesh = newMesh;
            record.bond = newBond;
            record.type = newType;
            record.colorKey = newType === 'H' ? null : colorKey;
        }

        // ============================================================
        // 拾取
        // ============================================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function doPick(clientX, clientY, pointerType) {
            if (isHidden) return;

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const visibleClickable = clickableAtoms.filter(a => a.visible);
            const intersects = raycaster.intersectObjects(visibleClickable, false);

            let hitMesh = null;
            if (intersects.length > 0) {
                hitMesh = intersects[0].object;
            } else if (pointerType !== 'mouse') {
                const v = new THREE.Vector3();
                let best = null, bestDist = 45;
                visibleClickable.forEach(atom => {
                    atom.getWorldPosition(v);
                    v.project(camera);
                    if (v.z < -1 || v.z > 1) return;
                    const sx = (v.x + 1) * 0.5 * window.innerWidth;
                    const sy = (-v.y + 1) * 0.5 * window.innerHeight;
                    const d = Math.sqrt((sx - clientX) ** 2 + (sy - clientY) ** 2);
                    if (d < bestDist) { bestDist = d; best = atom; }
                });
                if (best) hitMesh = best;
            }

            if (!hitMesh) return;

            const record = switchableAtoms.find(r => r.mesh === hitMesh);
            if (!record) return;

            if (record.type === 'H') {
                swapAtom(record, 'colored', selectedColorKey);
            } else {
                swapAtom(record, 'H');
            }
        }

        // ============================================================
        // 触屏 / 鼠标 点击识别（三段式）
        // ============================================================
        const activePointers = new Set();
        let pointerDownInfo = null;

        renderer.domElement.addEventListener('pointerdown', (e) => {
            activePointers.add(e.pointerId);
            if (activePointers.size === 1) {
                pointerDownInfo = {
                    x: e.clientX, y: e.clientY,
                    t: performance.now(),
                    pointerType: e.pointerType || 'touch',
                    id: e.pointerId
                };
            } else {
                pointerDownInfo = null;
            }
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            if (!pointerDownInfo || pointerDownInfo.id !== e.pointerId || activePointers.size !== 1) return;
            const dx = e.clientX - pointerDownInfo.x;
            const dy = e.clientY - pointerDownInfo.y;
            const thr = pointerDownInfo.pointerType === 'mouse' ? 6 : 12;
            if (dx * dx + dy * dy > thr * thr) pointerDownInfo = null;
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            const countBeforeUp = activePointers.size;
            if (pointerDownInfo && pointerDownInfo.id === e.pointerId && countBeforeUp === 1) {
                const dx = e.clientX - pointerDownInfo.x;
                const dy = e.clientY - pointerDownInfo.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const dt = performance.now() - pointerDownInfo.t;
                const thr = pointerDownInfo.pointerType === 'mouse' ? 6 : 12;
                if (dist <= thr && dt <= 500) {
                    doPick(e.clientX, e.clientY, pointerDownInfo.pointerType);
                }
            }
            activePointers.delete(e.pointerId);
            if (activePointers.size === 0) pointerDownInfo = null;
        });

        renderer.domElement.addEventListener('pointercancel', (e) => {
            activePointers.delete(e.pointerId);
            if (activePointers.size === 0) pointerDownInfo = null;
        });
        window.addEventListener('pointerup', (e) => {
            activePointers.delete(e.pointerId);
            if (activePointers.size === 0) pointerDownInfo = null;
        });
        window.addEventListener('pointercancel', (e) => {
            activePointers.delete(e.pointerId);
            if (activePointers.size === 0) pointerDownInfo = null;
        });
        window.addEventListener('blur', () => {
            activePointers.clear();
            pointerDownInfo = null;
        });

        ['gesturestart', 'gesturechange', 'gestureend'].forEach(evtName => {
            document.addEventListener(evtName, (e) => e.preventDefault(), { passive: false });
        });

        const controlsPanel = document.getElementById('controls');
        controlsPanel.addEventListener('pointerdown', (e) => e.stopPropagation());
        controlsPanel.addEventListener('pointermove', (e) => e.stopPropagation());

        // ============================================================
        // 相机自适应
        // ============================================================
        function updateCameraZoom() {
            const aspect = window.innerWidth / window.innerHeight;
            const dist = camera.position.distanceTo(controls.target);
            const fovRad = THREE.MathUtils.degToRad(camera.fov / 2);
            const baseVisibleH = 2 * dist * Math.tan(fovRad);
            const baseVisibleW = baseVisibleH * aspect;

            const contentW = 5.5;
            const contentH = 4.5;

            const zoomForW = baseVisibleW / contentW;
            const zoomForH = baseVisibleH / contentH;

            const isLandscape = aspect > 1;
            const maxZoom = isLandscape ? 1.0 : 0.95;
            const minZoom = isLandscape ? 0.55 : 0.30;

            camera.zoom = Math.max(minZoom, Math.min(maxZoom, zoomForW, zoomForH));
            camera.updateProjectionMatrix();
        }
        updateCameraZoom();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        let resizeTimer = null;
        function onWindowResize() {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                updateCameraZoom();
            }, 60);
        }
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 300));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', onWindowResize);
        }
    </script>
