function escapeHtml(s){return s?s.replace(/[&<>]/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])):''}
function renderCards(id,list){
  const e=document.getElementById(id);
  if(!e)return;
  e.innerHTML='';
  list.forEach(i=>{
    const a=document.createElement('a');
    a.className='card';
    a.href=i.file;
    a.target='_self';
    a.dataset.name = i.name;
    a.innerHTML=`<div class="card-title">🔬 ${escapeHtml(i.name)}</div>`;
    e.appendChild(a)
  })
}
// 搜索功能
const searchInput = document.querySelector('.search-input');
const searchBtn = document.querySelector('.search-btn');
// 清除所有高亮
function clearHighlight() {
  document.querySelectorAll('.card.active').forEach(card => {
    card.classList.remove('active');
  });
}
// 搜索执行
function doSearch(){
  clearHighlight();
  let key = searchInput.value.trim().toLowerCase();
  if(!key) return;
  let findSec = null;
  document.querySelectorAll('.card').forEach(card=>{
    let name = card.dataset.name.toLowerCase();
    if(name.includes(key)){
      card.classList.add('active');
      findSec = card.closest('.category-section');
    }
  });
  if(findSec){
    findSec.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
// 点击按钮搜索
searchBtn.addEventListener('click', doSearch);
// 回车搜索
searchInput.addEventListener('keydown',function(e){
  if(e.key === 'Enter') doSearch();
});
// 点击页面其他位置 → 清除高亮
document.addEventListener('click', function(e) {
  const isSearchArea = e.target.closest('.search-wrap') !== null;
  const isCard = e.target.closest('.card') !== null;
  
  // 只有点击非搜索区、非卡片时才清除
  if (!isSearchArea && !isCard) {
    clearHighlight();
  }
});
window.onload=()=>{
  renderCards('crystalGrid',modelData.crystal);
  renderCards('electronGrid',modelData.electron);
  renderCards('organicGrid',modelData.organic);
  renderCards('otherGrid',modelData.other);

}
