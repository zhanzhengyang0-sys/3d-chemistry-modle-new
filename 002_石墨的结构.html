<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>石墨双层 · 极简触屏版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: white; font-family: 'Inter', sans-serif; touch-action: pan-y pinch-zoom; }
        
        /* 所有非必要的文字板块已完全移除 */
        
        /* 极简控制栏 - 超薄设计 */
        .control-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 25px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            padding: 8px 24px;
            border-radius: 50px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 200;
            pointer-events: auto;
            min-width: auto;
            max-width: 95%;
            line-height: 1;
        }
        
        /* 左侧信息已移除，只保留右侧控件 */
        .right-controls {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
        }
        
        /* 选色模块 - 紧凑 */
        .color-picker {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
            padding-left: 0;
            border-left: none;
        }
        .color-picker span {
            font-weight: 500;
            color: #333;
            font-size: 13px;
            white-space: nowrap;
        }
        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 28px;
            border: 2px solid white;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            flex-shrink: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .color-btn:hover {
            transform: scale(1.1);
        }
        .color-btn.selected {
            border: 3px solid #333;
            transform: scale(1.08);
            box-shadow: 0 0 0 2px gold;
        }
        .color-btn.red { background-color: #ff3333; }
        .color-btn.black { background-color: #000000; }
        
        #current-color-status {
            font-size: 12px;
            color: #555;
            background: #f0f0f0;
            padding: 3px 8px;
            border-radius: 30px;
            margin-left: 3px;
            white-space: nowrap;
        }
        
        /* 层间距滑块模块 - 紧凑 */
        .spacing-control {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            padding-left: 15px;
            border-left: 1px solid #ccc;
        }
        .spacing-control span {
            font-weight: 500;
            color: #333;
            font-size: 13px;
            white-space: nowrap;
        }
        .spacing-control input {
            width: 120px;
            height: 4px;
            border-radius: 4px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
            touch-action: manipulation;
        }
        .spacing-control input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 16px;
            background: #3366ff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            border: 2px solid white;
        }
        .spacing-control input::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 16px;
            background: #3366ff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            border: 2px solid white;
        }
        #spacing-value {
            min-width: 35px;
            font-weight: 600;
            color: #3366ff;
            background: #f0f0f0;
            padding: 3px 8px;
            border-radius: 30px;
            text-align: center;
            font-size: 12px;
        }
        
        /* 右侧触屏提示 */
        .touch-hint-right {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            color: #ffd966;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid #ffd96666;
            z-index: 300;
            pointer-events: none;
            white-space: nowrap;
            opacity: 0.8;
        }
        
        /* 触屏设备上适当调整 */
        @media (max-width: 768px) {
            .control-bar {
                padding: 6px 18px;
                gap: 15px;
                bottom: 25px;
            }
            .right-controls {
                gap: 15px;
            }
            .color-btn {
                width: 32px;
                height: 32px;
            }
            .spacing-control input {
                width: 100px;
            }
            .touch-hint-right {
                bottom: 90px;
                font-size: 11px;
                padding: 3px 12px;
            }
        }
    </style>

    </head>
<body>
    <!-- 所有文字板块已移除：info、note 都已删除 -->
    
    <!-- 极简控制栏 - 超薄设计 -->
    <div class="control-bar">
        <div class="right-controls">
            <!-- 选色模块 - 只有黑色和红色 -->
            <div class="color-picker">
                <span>🎨</span>
                <div id="color-black" class="color-btn black selected" title="黑色"></div>
                <div id="color-red" class="color-btn red" title="红色"></div>
                <span id="current-color-status">黑色</span>
            </div>
            
            <!-- 层间距滑块模块 -->
            <div class="spacing-control">
                <span>📏</span>
                <input type="range" id="spacing-slider" min="0.1" max="4.0" step="0.1" value="2.0">
                <span id="spacing-value">2.0</span>
            </div>
        </div>
    </div>

    <!-- 右侧触屏提示 -->
    <div class="touch-hint-right">👆 点击整层换色</div>

    <script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="libs/CSS2DRenderer.js"></script>
<script>window.OrbitControls=THREE.OrbitControls;window.CSS2DRenderer=THREE.CSS2DRenderer;window.CSS2DObject=THREE.CSS2DObject;</script>
<script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-jserr',String(e.message).slice(0,120))},true);</script>
<script>

        // --- 初始化场景 (纯白背景) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        // --- 相机 ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 4, 14);

        // --- 渲染器 ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0xffffff);
        document.body.appendChild(renderer.domElement);

        // --- 轨道控制器 (触屏优化) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 1.0, 0);
        controls.touchRotate = true;
        controls.touchZoom = true;
        controls.touchPan = true;

        // --- 光照 ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight1.position.set(3, 8, 4);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight2.position.set(-4, 5, -5);
        scene.add(dirLight2);

        const backLight = new THREE.PointLight(0xffffff, 0.6);
        backLight.position.set(0, 4, -8);
        scene.add(backLight);

        const fillLight = new THREE.PointLight(0xffffff, 0.4);
        fillLight.position.set(2, 3, 5);
        scene.add(fillLight);

        // ========== 构建完美六元环石墨双层 ==========
        
        const bondLength = 1.42;
        const atomRadius = 0.44;      // 2倍大
        let layerSpacing = 2.0;        // 初始层间距
        const sqrt3 = Math.sqrt(3);
        
        // 化学键材质 - 更深灰色 (#4a4a4a)
        const bondMat = new THREE.MeshStandardMaterial({
            color: 0x4a4a4a,
            roughness: 0.5,
            metalness: 0.1
        });
        const bondRadius = 0.1;
        
        function createAtom(posX, posY, posZ) {
            const geometry = new THREE.SphereGeometry(atomRadius, 48, 24);
            const material = new THREE.MeshStandardMaterial({
                color: 0x111111,
                roughness: 0.3,
                metalness: 0.1,
                emissive: 0x000000
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(posX, posY, posZ);
            return sphere;
        }
        
        function createBond(p1, p2) {
            const start = new THREE.Vector3(p1[0], p1[1], p1[2]);
            const end = new THREE.Vector3(p2[0], p2[1], p2[2]);
            
            const direction = new THREE.Vector3().subVectors(end, start);
            const length = direction.length();
            
            const center = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
            
            const cylinderGeo = new THREE.CylinderGeometry(bondRadius, bondRadius, length, 8);
            const cylinder = new THREE.Mesh(cylinderGeo, bondMat);
            
            const defaultDir = new THREE.Vector3(0, 1, 0);
            const quat = new THREE.Quaternion().setFromUnitVectors(defaultDir, direction.clone().normalize());
            cylinder.applyQuaternion(quat);
            cylinder.position.copy(center);
            
            return cylinder;
        }

        // ========== 生成完美六边形区域 ==========
        const basis1 = new THREE.Vector3(1.5 * bondLength, 0, (sqrt3/2) * bondLength);
        const basis2 = new THREE.Vector3(1.5 * bondLength, 0, -(sqrt3/2) * bondLength);
        const offsetB = new THREE.Vector3().addVectors(
            basis1.clone().multiplyScalar(1/3),
            basis2.clone().multiplyScalar(1/3)
        );
        
        const size = 3;
        const allAtoms = [];
        
        for (let i = -size; i <= size; i++) {
            for (let j = -size; j <= size; j++) {
                if (Math.abs(i) <= size && Math.abs(j) <= size && Math.abs(i + j) <= size) {
                    const basePos = new THREE.Vector3().addVectors(
                        basis1.clone().multiplyScalar(i),
                        basis2.clone().multiplyScalar(j)
                    );
                    
                    allAtoms.push(basePos.clone());
                    allAtoms.push(new THREE.Vector3().addVectors(basePos, offsetB));
                }
            }
        }
        
        const posMap = new Map();
        allAtoms.forEach((pos) => {
            const key = `${pos.x.toFixed(2)},${pos.z.toFixed(2)}`;
            posMap.set(key, true);
        });
        
        function hasThreeNeighbors(pos, posMap, bondLength) {
            const neighbors = [
                [pos.x + bondLength, pos.z],
                [pos.x - bondLength, pos.z],
                [pos.x + bondLength/2, pos.z + (sqrt3/2)*bondLength],
                [pos.x - bondLength/2, pos.z + (sqrt3/2)*bondLength],
                [pos.x + bondLength/2, pos.z - (sqrt3/2)*bondLength],
                [pos.x - bondLength/2, pos.z - (sqrt3/2)*bondLength]
            ];
            
            let count = 0;
            for (let [nx, nz] of neighbors) {
                const key = `${nx.toFixed(2)},${nz.toFixed(2)}`;
                if (posMap.has(key)) {
                    count++;
                }
            }
            return count === 3;
        }
        
        const internalAtoms = [];
        allAtoms.forEach(pos => {
            if (hasThreeNeighbors(pos, posMap, bondLength)) {
                internalAtoms.push(pos.clone());
            }
        });
        
        console.log(`内部原子数: ${internalAtoms.length} / ${allAtoms.length}`);
        
        // 第一层
        const layer1Atoms = internalAtoms.map(pos => pos.clone());
        
        // 存储每层原子mesh的数组
        const layer1AtomMeshes = [];
        const layer2AtomMeshes = [];
        
        // 添加第一层原子
        layer1Atoms.forEach(pos => {
            const atom = createAtom(pos.x, 0, pos.z);
            scene.add(atom);
            layer1AtomMeshes.push(atom);
        });
        
        // 构建第一层内的键
        const bondSet = new Set();
        
        function getBondKey(i, j) {
            return i < j ? `${i}-${j}` : `${j}-${i}`;
        }
        
        const layer1PosMap = new Map();
        layer1Atoms.forEach((pos, idx) => {
            const key = `${pos.x.toFixed(2)},${pos.z.toFixed(2)}`;
            layer1PosMap.set(key, idx);
        });
        
        for (let i = 0; i < layer1Atoms.length; i++) {
            const pos1 = layer1Atoms[i];
            
            const neighborOffsets = [
                [bondLength, 0],
                [-bondLength, 0],
                [bondLength/2, (sqrt3/2)*bondLength],
                [-bondLength/2, (sqrt3/2)*bondLength],
                [bondLength/2, -(sqrt3/2)*bondLength],
                [-bondLength/2, -(sqrt3/2)*bondLength]
            ];
            
            for (let [dx, dz] of neighborOffsets) {
                const nx = pos1.x + dx;
                const nz = pos1.z + dz;
                const key = `${nx.toFixed(2)},${nz.toFixed(2)}`;
                
                if (layer1PosMap.has(key)) {
                    const j = layer1PosMap.get(key);
                    if (i < j) {
                        const bondKey = getBondKey(i, j);
                        if (!bondSet.has(bondKey)) {
                            bondSet.add(bondKey);
                            const bond = createBond([pos1.x, 0, pos1.z], [nx, 0, nz]);
                            scene.add(bond);
                        }
                    }
                }
            }
        }
        
        // 第二层：AB堆垛
        const abShift = new THREE.Vector3().addVectors(basis1, basis2).multiplyScalar(1/3);
        const layer2AtomObjects = [];
        
        const layer2Atoms = layer1Atoms.map(pos => {
            return new THREE.Vector3(
                pos.x + abShift.x,
                layerSpacing,
                pos.z + abShift.z
            );
        });
        
        layer2Atoms.forEach(pos => {
            const atom = createAtom(pos.x, pos.y, pos.z);
            scene.add(atom);
            layer2AtomMeshes.push(atom);
            layer2AtomObjects.push(atom);
        });
        
        const layer2PosMap = new Map();
        layer2Atoms.forEach((pos, idx) => {
            const key = `${pos.x.toFixed(2)},${pos.z.toFixed(2)}`;
            layer2PosMap.set(key, idx);
        });
        
        const bondSet2 = new Set();
        const layer2Bonds = [];
        
        for (let i = 0; i < layer2Atoms.length; i++) {
            const pos1 = layer2Atoms[i];
            
            const neighborOffsets = [
                [bondLength, 0],
                [-bondLength, 0],
                [bondLength/2, (sqrt3/2)*bondLength],
                [-bondLength/2, (sqrt3/2)*bondLength],
                [bondLength/2, -(sqrt3/2)*bondLength],
                [-bondLength/2, -(sqrt3/2)*bondLength]
            ];
            
            for (let [dx, dz] of neighborOffsets) {
                const nx = pos1.x + dx;
                const nz = pos1.z + dz;
                const key = `${nx.toFixed(2)},${nz.toFixed(2)}`;
                
                if (layer2PosMap.has(key)) {
                    const j = layer2PosMap.get(key);
                    if (i < j) {
                        const bondKey = getBondKey(i, j);
                        if (!bondSet2.has(bondKey)) {
                            bondSet2.add(bondKey);
                            const bond = createBond([pos1.x, pos1.y, pos1.z], [nx, pos1.y, nz]);
                            scene.add(bond);
                            layer2Bonds.push(bond);
                        }
                    }
                }
            }
        }
        
        controls.target.set(0, layerSpacing/2, 0);
        camera.position.set(10, 4, 14);
        controls.update();

        console.log(`最终总原子数: ${layer1Atoms.length + layer2Atoms.length}`);

        // ========== 颜色选择与整层换色 (支持触屏) ==========
        const colorBlackBtn = document.getElementById('color-black');
        const colorRedBtn = document.getElementById('color-red');
        const currentColorStatus = document.getElementById('current-color-status');
        
        let selectedColor = 0x000000; // 默认黑色
        
        colorBlackBtn.classList.add('selected');
        
        function handleColorSelect(colorHex, colorName, element) {
            return function(event) {
                event.preventDefault();
                selectedColor = colorHex;
                [colorBlackBtn, colorRedBtn].forEach(btn => btn.classList.remove('selected'));
                element.classList.add('selected');
                currentColorStatus.innerText = colorName;
            };
        }
        
        colorBlackBtn.addEventListener('click', handleColorSelect(0x000000, '黑色', colorBlackBtn));
        colorBlackBtn.addEventListener('touchstart', handleColorSelect(0x000000, '黑色', colorBlackBtn), { passive: false });
        
        colorRedBtn.addEventListener('click', handleColorSelect(0xff3333, '红色', colorRedBtn));
        colorRedBtn.addEventListener('touchstart', handleColorSelect(0xff3333, '红色', colorRedBtn), { passive: false });

        // 射线检测器 - 用于识别点击的是哪一层 (支持触屏)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onPick(event) {
            event.preventDefault();
            
            const rect = renderer.domElement.getBoundingClientRect();
            let clientX, clientY;
            
            if (event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const allAtoms = [...layer1AtomMeshes, ...layer2AtomMeshes];
            const intersects = raycaster.intersectObjects(allAtoms);
            
            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                
                let targetLayer = null;
                if (layer1AtomMeshes.includes(hitMesh)) {
                    targetLayer = layer1AtomMeshes;
                } else if (layer2AtomMeshes.includes(hitMesh)) {
                    targetLayer = layer2AtomMeshes;
                }
                
                if (targetLayer) {
                    targetLayer.forEach(atom => {
                        atom.material.color.setHex(selectedColor);
                        
                        if (selectedColor === 0x000000) {
                            atom.material.emissive.setHex(0x000000);
                        } else {
                            atom.material.emissive.setHex(selectedColor);
                            atom.material.emissive.multiplyScalar(0.15);
                        }
                    });
                }
            }
        }

        renderer.domElement.addEventListener('click', onPick);
        renderer.domElement.addEventListener('touchstart', onPick, { passive: false });

        // ========== 层间距滑块控制 ==========
        const spacingSlider = document.getElementById('spacing-slider');
        const spacingValue = document.getElementById('spacing-value');
        
        spacingSlider.addEventListener('input', (e) => {
            const newSpacing = parseFloat(e.target.value);
            spacingValue.textContent = newSpacing.toFixed(1);
            
            layer2AtomObjects.forEach((atom) => {
                atom.position.y = newSpacing;
            });
            
            layer2Bonds.forEach(bond => {
                scene.remove(bond);
            });
            
            layer2Bonds.length = 0;
            bondSet2.clear();
            
            const updatedLayer2Atoms = layer2AtomObjects.map(atom => atom.position);
            
            const newLayer2PosMap = new Map();
            updatedLayer2Atoms.forEach((pos, idx) => {
                const key = `${pos.x.toFixed(2)},${pos.z.toFixed(2)}`;
                newLayer2PosMap.set(key, idx);
            });
            
            for (let i = 0; i < updatedLayer2Atoms.length; i++) {
                const pos1 = updatedLayer2Atoms[i];
                
                const neighborOffsets = [
                    [bondLength, 0],
                    [-bondLength, 0],
                    [bondLength/2, (sqrt3/2)*bondLength],
                    [-bondLength/2, (sqrt3/2)*bondLength],
                    [bondLength/2, -(sqrt3/2)*bondLength],
                    [-bondLength/2, -(sqrt3/2)*bondLength]
                ];
                
                for (let [dx, dz] of neighborOffsets) {
                    const nx = pos1.x + dx;
                    const nz = pos1.z + dz;
                    const key = `${nx.toFixed(2)},${nz.toFixed(2)}`;
                    
                    if (newLayer2PosMap.has(key)) {
                        const j = newLayer2PosMap.get(key);
                        if (i < j) {
                            const bondKey = getBondKey(i, j);
                            if (!bondSet2.has(bondKey)) {
                                bondSet2.add(bondKey);
                                const bond = createBond([pos1.x, pos1.y, pos1.z], [nx, pos1.y, nz]);
                                scene.add(bond);
                                layer2Bonds.push(bond);
                            }
                        }
                    }
                }
            }
        });

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
