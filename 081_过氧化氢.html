<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>双氧水 H₂O₂ · 3D 球棍模型（gauche 构象）</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #legend {
            position: absolute;
            bottom: calc(58px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.92);
            padding: 5px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-size: 11px;
            color: #444;
            z-index: 100;
            display: flex;
            gap: 12px;
            white-space: nowrap;
            pointer-events: none;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        #controls-bar {
            position: absolute;
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.92);
            padding: 4px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #ddd;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 14px;
            height: 28px;
            font-size: 12px;
            color: #333;
            touch-action: none;
            pointer-events: auto;
            white-space: nowrap;
        }
        #controls-bar label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            user-select: none;
        }
        #controls-bar input {
            width: 14px;
            height: 14px;
            margin: 0;
            accent-color: #e67e22;
            cursor: pointer;
        }
        @media (max-width: 480px) {
            #legend {
                font-size: 10px;
                padding: 4px 12px;
                gap: 10px;
            }
            .legend-dot {
                width: 9px;
                height: 9px;
            }
            #controls-bar {
                font-size: 11px;
                padding: 3px 12px;
                gap: 10px;
                height: 26px;
            }
            #controls-bar input {
                width: 13px;
                height: 13px;
            }
        }
    </style>
</head>
<body>
    <div id="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#e67e22;"></div>O</div>
        <div class="legend-item"><div class="legend-dot" style="background:#2980b9;"></div>H</div>
        <div class="legend-item"><div class="legend-dot" style="background:#9b59b6; opacity:0.6;"></div>孤对电子</div>
    </div>

    <div id="controls-bar">
        <label>
            <input type="checkbox" id="planeToggle">
            半透明面
        </label>
        <label>
            <input type="checkbox" id="lonePairToggle">
            孤对电子
        </label>
    </div>

    <script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="libs/CSS2DRenderer.js"></script>
<script>window.OrbitControls=THREE.OrbitControls;window.CSS2DRenderer=THREE.CSS2DRenderer;window.CSS2DObject=THREE.CSS2DObject;</script>
<script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-jserr',String(e.message).slice(0,120))},true);</script>
<script>

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.domElement.style.touchAction = 'none';
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.rotateSpeed = 0.9;
        controls.zoomSpeed = 0.9;
        controls.panSpeed = 0.9;
        controls.target.set(0, 0, 0);

        function fitCameraToScreen() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const aspect = w / h;

            let dist;
            if (aspect < 1) dist = 7.0;
            else if (aspect < 1.6) dist = 6.3;
            else dist = 5.7;

            const dir = new THREE.Vector3(1.0, 0.75, 1.3).normalize();
            camera.position.copy(dir.multiplyScalar(dist));
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);

            camera.aspect = aspect;
            camera.updateProjectionMatrix();
            controls.update();
        }

        scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        const d1 = new THREE.DirectionalLight(0xffffff, 0.9);
        d1.position.set(5, 8, 6);
        scene.add(d1);
        const d2 = new THREE.DirectionalLight(0xccddff, 0.5);
        d2.position.set(-5, -3, -6);
        scene.add(d2);
        const d3 = new THREE.DirectionalLight(0xffeecc, 0.4);
        d3.position.set(2, -6, 4);
        scene.add(d3);

        const oMat = new THREE.MeshStandardMaterial({ color: 0xe67e22, roughness: 0.3, metalness: 0.1 });
        const hMat = new THREE.MeshStandardMaterial({ color: 0x2980b9, roughness: 0.4, metalness: 0.05 });
        const bondMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.6, metalness: 0.0, transparent: true, opacity: 0.98 });
        const lonePairMat = new THREE.MeshStandardMaterial({
            color: 0x9b59b6,
            roughness: 0.4,
            metalness: 0.0,
            transparent: true,
            opacity: 0.55,
            emissive: 0x4a235a,
            emissiveIntensity: 0.25
        });

        const plane1Mat = new THREE.MeshStandardMaterial({
            color: 0x27ae60,
            transparent: true,
            opacity: 0.25,
            side: THREE.DoubleSide,
            depthWrite: false,
            roughness: 0.9,
            metalness: 0.0
        });
        const plane2Mat = new THREE.MeshStandardMaterial({
            color: 0x8e44ad,
            transparent: true,
            opacity: 0.25,
            side: THREE.DoubleSide,
            depthWrite: false,
            roughness: 0.9,
            metalness: 0.0
        });

        // ============================================================
        // rootGroup：整体旋转用
        //   O–O 键原本沿 y 轴竖直，绕 z 轴转 90° → 变成沿 x 轴水平
        // ============================================================
        const rootGroup = new THREE.Group();
        scene.add(rootGroup);

        const atomGroup = new THREE.Group();
        const bondGroup = new THREE.Group();
        const lonePairGroup = new THREE.Group();
        const planeGroup = new THREE.Group();
        rootGroup.add(atomGroup);
        rootGroup.add(bondGroup);
        rootGroup.add(lonePairGroup);
        rootGroup.add(planeGroup);

        // 初始隐藏
        planeGroup.visible = false;
        lonePairGroup.visible = false;

        function addSphere(group, pos, radius, material) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(radius, 28, 18), material);
            m.position.copy(pos);
            group.add(m);
            return m;
        }

        function makeBond(start, end, radius, material) {
            const dir = new THREE.Vector3().subVectors(end, start);
            const len = dir.length();
            if (len < 0.001) return null;
            const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 10), material);
            cyl.position.copy(new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5));
            cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
            bondGroup.add(cyl);
            return cyl;
        }

        function makeWaterDropGeometry(length, maxRadius, segments = 400) {
            const ctrl = [
                [0.00, 0.000],
                [0.06, 0.015],
                [0.14, 0.05],
                [0.26, 0.11],
                [0.40, 0.20],
                [0.55, 0.31],
                [0.70, 0.43],
                [0.83, 0.54],
                [0.93, 0.63],
                [0.99, 0.71],
                [1.00, 0.78],
                [0.99, 0.83],
                [0.95, 0.87],
                [0.88, 0.905],
                [0.78, 0.935],
                [0.64, 0.958],
                [0.48, 0.975],
                [0.30, 0.988],
                [0.14, 0.996],
                [0.00, 1.000]
            ];

            const points3 = ctrl.map(p => new THREE.Vector3(p[0] * maxRadius, p[1] * length, 0));
            const curve = new THREE.CatmullRomCurve3(points3, false, 'catmullrom', 0.5);

            const raw = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const p = curve.getPoint(t);
                raw.push(new THREE.Vector2(Math.max(p.x, 0.0001), p.y));
            }

            const pts = raw.map((p, i) => {
                if (i < 2 || i > raw.length - 3) return p.clone();
                const r = (
                    raw[i - 2].x + raw[i - 1].x + raw[i].x + raw[i + 1].x + raw[i + 2].x
                ) / 5;
                return new THREE.Vector2(Math.max(r, 0.0001), p.y);
            });

            pts[0].x = 0.0001;
            pts[pts.length - 1].x = 0.0001;

            const geo = new THREE.LatheGeometry(pts, 128);
            geo.computeVertexNormals();
            return geo;
        }

        function makeLonePairDrop(nPos, dir, nRadius, length, maxRadius, material) {
            const geo = makeWaterDropGeometry(length, maxRadius, 400);
            const mesh = new THREE.Mesh(geo, material);

            const tipOffset = Math.max(nRadius - 0.05, 0);
            const tipPos = nPos.clone().add(dir.clone().normalize().multiplyScalar(tipOffset));

            mesh.position.copy(tipPos);
            mesh.quaternion.setFromUnitVectors(
                new THREE.Vector3(0, 1, 0),
                dir.clone().normalize()
            );
            lonePairGroup.add(mesh);
            return mesh;
        }

        // ============================================================
        // 双氧水 H₂O₂ · gauche 构象
        // ============================================================

        const oRadius   = 0.28;
        const hRadius   = 0.18;
        const bondRadius = 0.055;

        const oHalf = 0.594;
        const L_OH = 0.775;

        const o1 = new THREE.Vector3(0,  oHalf, 0);
        const o2 = new THREE.Vector3(0, -oHalf, 0);

        const angleOOH = 94.8 * Math.PI / 180;
        const yOH = -Math.cos(angleOOH);
        const rOH = Math.sin(angleOOH);

        const sinT = Math.sqrt(8) / 3;
        const yCompUp   =  1 / 3;
        const yCompDown = -1 / 3;

        const o1_dirH1 = new THREE.Vector3(rOH * Math.cos(0), yOH, rOH * Math.sin(0));

        const phiLP1a = 2 * Math.PI / 3;
        const phiLP1b = 4 * Math.PI / 3;
        const o1_dirLP1a = new THREE.Vector3(sinT * Math.cos(phiLP1a), yCompUp, sinT * Math.sin(phiLP1a));
        const o1_dirLP1b = new THREE.Vector3(sinT * Math.cos(phiLP1b), yCompUp, sinT * Math.sin(phiLP1b));

        const phiH2 = 111 * Math.PI / 180;
        const o2_dirH2 = new THREE.Vector3(rOH * Math.cos(phiH2), -yOH, rOH * Math.sin(phiH2));

        const phiLP2a = phiH2 + 2 * Math.PI / 3;
        const phiLP2b = phiH2 + 4 * Math.PI / 3;
        const o2_dirLP2a = new THREE.Vector3(sinT * Math.cos(phiLP2a), yCompDown, sinT * Math.sin(phiLP2a));
        const o2_dirLP2b = new THREE.Vector3(sinT * Math.cos(phiLP2b), yCompDown, sinT * Math.sin(phiLP2b));

        const h1 = o1.clone().add(o1_dirH1.clone().multiplyScalar(L_OH));
        const h2 = o2.clone().add(o2_dirH2.clone().multiplyScalar(L_OH));

        addSphere(atomGroup, o1, oRadius, oMat);
        addSphere(atomGroup, o2, oRadius, oMat);
        addSphere(atomGroup, h1, hRadius, hMat);
        addSphere(atomGroup, h2, hRadius, hMat);

        const lpLength = 0.85;
        const lpMaxR   = 0.22;

        makeLonePairDrop(o1, o1_dirLP1a, oRadius, lpLength, lpMaxR, lonePairMat);
        makeLonePairDrop(o1, o1_dirLP1b, oRadius, lpLength, lpMaxR, lonePairMat);
        makeLonePairDrop(o2, o2_dirLP2a, oRadius, lpLength, lpMaxR, lonePairMat);
        makeLonePairDrop(o2, o2_dirLP2b, oRadius, lpLength, lpMaxR, lonePairMat);

        makeBond(o1, o2, bondRadius, bondMat);
        makeBond(o1, h1, bondRadius, bondMat);
        makeBond(o2, h2, bondRadius, bondMat);

        // ============================================================
        // 两个半透明页面（笔记本形状）
        // ============================================================

        function makeNotebookPage(spineStart, spineEnd, hPoint, heightFactor, spineExtendRatio, material) {
            const spineVec = new THREE.Vector3().subVectors(spineEnd, spineStart);
            const spineLen = spineVec.length();
            const spineDir = spineVec.clone().normalize();
            const mid = new THREE.Vector3().addVectors(spineStart, spineEnd).multiplyScalar(0.5);

            const toH = new THREE.Vector3().subVectors(hPoint, mid);
            const projOnSpine = toH.dot(spineDir);
            const outDir = new THREE.Vector3().subVectors(
                toH,
                spineDir.clone().multiplyScalar(projOnSpine)
            );
            const outLen = outDir.length();
            if (outLen < 0.001) return null;
            outDir.normalize();

            const pageHeight = outLen * heightFactor;

            const extend = spineLen * spineExtendRatio;

            const A = spineStart.clone().sub(spineDir.clone().multiplyScalar(extend));
            const B = spineEnd.clone().add(spineDir.clone().multiplyScalar(extend));
            const C = B.clone().add(outDir.clone().multiplyScalar(pageHeight));
            const D = A.clone().add(outDir.clone().multiplyScalar(pageHeight));

            const geo = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                A.x, A.y, A.z,
                B.x, B.y, B.z,
                C.x, C.y, C.z,

                A.x, A.y, A.z,
                C.x, C.y, C.z,
                D.x, D.y, D.z
            ]);
            geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geo.computeVertexNormals();

            return new THREE.Mesh(geo, material);
        }

        const heightFactor = 1.3;
        const spineExtendRatio = 0.3;

        const page1 = makeNotebookPage(o1, o2, h1, heightFactor, spineExtendRatio, plane1Mat);
        if (page1) planeGroup.add(page1);

        const page2 = makeNotebookPage(o1, o2, h2, heightFactor, spineExtendRatio, plane2Mat);
        if (page2) planeGroup.add(page2);

        // ============================================================
        // 初始姿态：让 O–O 键横放
        //   O–O 原本沿 y 轴竖直，绕 z 轴转 90° → 沿 x 轴水平
        // ============================================================
        rootGroup.rotation.z = Math.PI / 2;

        // ============================================================
        // 控制面板
        // ============================================================
        const planeToggle = document.getElementById('planeToggle');
        const lonePairToggle = document.getElementById('lonePairToggle');

        planeToggle.addEventListener('change', (e) => {
            planeGroup.visible = e.target.checked;
        });

        lonePairToggle.addEventListener('change', (e) => {
            lonePairGroup.visible = e.target.checked;
        });

        // --- 初始相机适配 ---
        fitCameraToScreen();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            fitCameraToScreen();
        }

        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(onResize, 200);
        });

        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('gesturechange', (e) => e.preventDefault());
        document.addEventListener('gestureend', (e) => e.preventDefault());
    </script>
