<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四水合铜 [Cu(H2O)4]2+</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #caption {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            color: #333;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
    <script src="libs/three.min.js"></script>
    <script src="libs/OrbitControls.js"></script>
</head>
<body>

    <div id="caption">四水合铜 [Cu(H₂O)₄]²⁺</div>

    <script>
        // 1. 场景、摄像机
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 8); 
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);

        // 2. 光线
        scene.add(new THREE.AmbientLight(0xffffff, 0.6)); 
        const light = new THREE.DirectionalLight(0xffffff, 0.8); 
        light.position.set(10, 15, 10);
        scene.add(light);

        // 3. 几何参数 
        const R_Cu_O = 2.6;  
        const R_O_H = 1.45;   
        
        const radiusCu = 0.9;
        const radiusO = 0.7;
        const radiusH = 0.42; 
        const bondR = 0.08;
        
        const colCu = 0x800080;
        const colO = 0xff0000;
        const colH = 0x00BFFF;
        // 【调整】化学键颜色改为更灰一点的中浅灰
        const colBond = 0xaaaaaa; 

        const matSphere = (color) => new THREE.MeshStandardMaterial({ 
            color, 
            roughness: 0.25,  
            metalness: 0.15   
        });
        const matBond = new THREE.MeshStandardMaterial({ color: colBond, roughness: 0.4 });

        function makeSphere(pos, radius, color) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), matSphere(color));
            mesh.position.set(pos.x, pos.y, pos.z);
            return mesh;
        }

        function makeBond(from, to) {
            const start = new THREE.Vector3(from.x, from.y, from.z);
            const end = new THREE.Vector3(to.x, to.y, to.z);
            const dir = new THREE.Vector3().subVectors(end, start);
            const length = dir.length();
            const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(bondR, bondR, length, 8), matBond);
            mesh.position.copy(mid);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
            return mesh;
        }

        function calcTetraH(O_pos, dirToCu, rotAngle) {
            const O_vec = new THREE.Vector3(O_pos.x, O_pos.y, O_pos.z);
            const axis = new THREE.Vector3(dirToCu.x, dirToCu.y, dirToCu.z).normalize();
            const outward = axis.clone().multiplyScalar(-1); 

            let perp = new THREE.Vector3(1, 0, 0);
            if (Math.abs(axis.dot(perp)) > 0.99) perp.set(0, 1, 0);
            perp.cross(axis).normalize();

            const coneAngle = 120 * Math.PI / 180;
            const halfAngle = coneAngle / 2;

            const quat1 = new THREE.Quaternion().setFromAxisAngle(axis, rotAngle);
            const quat2 = new THREE.Quaternion().setFromAxisAngle(axis, rotAngle + (2 * Math.PI / 3));

            const baseVec = perp.clone().multiplyScalar(Math.sin(halfAngle))
                               .add(outward.clone().multiplyScalar(Math.cos(halfAngle))).normalize();

            const dir1 = baseVec.clone().applyQuaternion(quat1).normalize();
            const dir2 = baseVec.clone().applyQuaternion(quat2).normalize();

            return {
                h1: O_vec.clone().add(dir1.clone().multiplyScalar(R_O_H)),
                h2: O_vec.clone().add(dir2.clone().multiplyScalar(R_O_H))
            };
        }

        // 计算坐标
        const Cu_abs = {x:0, y:0, z:0};
        const O_up_abs = {x:0, y:R_Cu_O, z:0};
        const O_down_abs = {x:0, y:-R_Cu_O, z:0};
        const O_left_abs = {x:-R_Cu_O, y:0, z:0};
        const O_right_abs = {x:R_Cu_O, y:0, z:0};

        const H_up_abs = calcTetraH(O_up_abs, {x:0, y:-1, z:0}, 0.5);
        const H_down_abs = calcTetraH(O_down_abs, {x:0, y:1, z:0}, 2.0);
        const H_left_abs = calcTetraH(O_left_abs, {x:1, y:0, z:0}, 3.5);
        const H_right_abs = calcTetraH(O_right_abs, {x:-1, y:0, z:0}, 1.0);

        function rotateToHorizontal(p) {
            return { x: p.x, y: p.z, z: -p.y };
        }

        const Cu = rotateToHorizontal(Cu_abs);
        const O_up = rotateToHorizontal(O_up_abs);
        const O_down = rotateToHorizontal(O_down_abs);
        const O_left = rotateToHorizontal(O_left_abs);
        const O_right = rotateToHorizontal(O_right_abs);
        
        const H_up = { h1: rotateToHorizontal(H_up_abs.h1), h2: rotateToHorizontal(H_up_abs.h2) };
        const H_down = { h1: rotateToHorizontal(H_down_abs.h1), h2: rotateToHorizontal(H_down_abs.h2) };
        const H_left = { h1: rotateToHorizontal(H_left_abs.h1), h2: rotateToHorizontal(H_left_abs.h2) };
        const H_right = { h1: rotateToHorizontal(H_right_abs.h1), h2: rotateToHorizontal(H_right_abs.h2) };

        // 渲染
        scene.add(makeSphere(Cu, radiusCu, colCu));
        [O_up, O_down, O_left, O_right].forEach(o => scene.add(makeSphere(o, radiusO, colO)));
        
        const allH = [H_up.h1, H_up.h2, H_down.h1, H_down.h2, H_left.h1, H_left.h2, H_right.h1, H_right.h2];
        allH.forEach(h => scene.add(makeSphere(h, radiusH, colH)));

        [O_up, O_down, O_left, O_right].forEach(o => scene.add(makeBond(Cu, o)));
        scene.add(makeBond(O_up, H_up.h1)); scene.add(makeBond(O_up, H_up.h2));
        scene.add(makeBond(O_down, H_down.h1)); scene.add(makeBond(O_down, H_down.h2));
        scene.add(makeBond(O_left, H_left.h1)); scene.add(makeBond(O_left, H_left.h2));
        scene.add(makeBond(O_right, H_right.h1)); scene.add(makeBond(O_right, H_right.h2));

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>

</html>
