<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SF₆ 分子结构 - 3D 模型</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: white;
    }
  </style>
</head>
<body>
  <!-- 引入 Three.js 核心库 -->
  <script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="libs/CSS2DRenderer.js"></script>
<script>window.OrbitControls=THREE.OrbitControls;window.CSS2DRenderer=THREE.CSS2DRenderer;window.CSS2DObject=THREE.CSS2DObject;</script>
<script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-jserr',String(e.message).slice(0,120))},true);</script>
<script>

    // ---------- 初始化场景 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    // ---------- 初始化相机 ----------
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5.5, 3.8, 6.5);
    camera.lookAt(0, 0, 0);

    // ---------- 初始化 WebGL渲染器 ----------
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      alpha: false 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0xffffff, 1);
    document.body.appendChild(renderer.domElement);

    // ---------- 控制器 ----------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.7;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.target.set(0, 0, 0);
    controls.minPolarAngle = 0;
    controls.maxPolarAngle = Math.PI;
    controls.update();

    // ---------- 光照设置 ----------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    
    const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight1.position.set(1, 2, 1.5);
    scene.add(directionalLight1);
    
    const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.35);
    directionalLight2.position.set(-0.8, -0.5, -1);
    scene.add(directionalLight2);
    
    const directionalLight3 = new THREE.DirectionalLight(0xffffff, 0.3);
    directionalLight3.position.set(0, 1.8, 0.2);
    scene.add(directionalLight3);
    
    const backLight = new THREE.DirectionalLight(0xffffff, 0.25);
    backLight.position.set(-0.5, -1, 0.8);
    scene.add(backLight);

    // ---------- 构建 SF₆ 分子（正八面体）----------
    const moleculeGroup = new THREE.Group();
    
    // SF₆ 结构参数
    // 硫原子在原点，6个氟原子在正八面体的6个顶点
    const bondLength = 2.2;  // S-F键长
    
    // 氟原子的6个位置（正八面体顶点）
    const fluorineOffsets = [
      new THREE.Vector3( bondLength, 0, 0),   // +X
      new THREE.Vector3(-bondLength, 0, 0),   // -X
      new THREE.Vector3( 0, bondLength, 0),   // +Y
      new THREE.Vector3( 0, -bondLength, 0),   // -Y
      new THREE.Vector3( 0, 0, bondLength),   // +Z
      new THREE.Vector3( 0, 0, -bondLength)    // -Z
    ];
    
    // 原子参数
    const sulfurColor = 0xf1c40f;    // 黄色（硫原子）
    const sulfurRadius = 0.55;
    
    const fluorineColor = 0x7ed6df;  // 浅青色/淡蓝绿（氟原子特征色）
    const fluorineRadius = 0.42;
    
    const sphereSegments = 48;
    
    // 化学键参数
    const bondColor = 0xb0b0b0;  // 灰白色键
    const bondRadius = 0.10;
    const bondSegments = 8;
    
    // 创建中心硫原子
    const sulfurGeometry = new THREE.SphereGeometry(sulfurRadius, sphereSegments, sphereSegments);
    const sulfurMaterial = new THREE.MeshStandardMaterial({
      color: sulfurColor,
      roughness: 0.5,
      metalness: 0.1,
      emissive: new THREE.Color(0x000000)
    });
    const sulfurAtom = new THREE.Mesh(sulfurGeometry, sulfurMaterial);
    sulfurAtom.position.set(0, 0, 0);
    moleculeGroup.add(sulfurAtom);
    
    // 创建6个氟原子
    fluorineOffsets.forEach((offset) => {
      const geometry = new THREE.SphereGeometry(fluorineRadius, sphereSegments, sphereSegments);
      const material = new THREE.MeshStandardMaterial({
        color: fluorineColor,
        roughness: 0.5,
        metalness: 0.05,
        emissive: new THREE.Color(0x000000)
      });
      const atom = new THREE.Mesh(geometry, material);
      atom.position.copy(offset);
      moleculeGroup.add(atom);
    });
    
    // 辅助函数：创建两点之间的圆柱体键
    function createBond(posA, posB) {
      const direction = new THREE.Vector3().subVectors(posB, posA);
      const length = direction.length();
      const midPoint = new THREE.Vector3().addVectors(posA, posB).multiplyScalar(0.5);
      
      const geometry = new THREE.CylinderGeometry(bondRadius, bondRadius, length, bondSegments);
      const material = new THREE.MeshStandardMaterial({
        color: bondColor,
        roughness: 0.6,
        metalness: 0.2,
        emissive: new THREE.Color(0x000000)
      });
      
      const cylinder = new THREE.Mesh(geometry, material);
      cylinder.position.copy(midPoint);
      
      cylinder.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.clone().normalize()
      );
      
      return cylinder;
    }
    
    // 创建6条 S-F 键
    const centerPos = new THREE.Vector3(0, 0, 0);
    fluorineOffsets.forEach((fPos) => {
      const bond = createBond(centerPos, fPos);
      moleculeGroup.add(bond);
    });
    
    // 将分子组添加到场景
    scene.add(moleculeGroup);
    
    // ---------- 动画循环 ----------
    function animate() {
      requestAnimationFrame(animate);
      
      controls.update();
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    // ---------- 窗口大小自适应 ----------
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    console.log('SF₆ 分子结构已加载。黄色：硫原子 | 浅青色：氟原子 | 灰白色：S-F键 | 正八面体构型');
  </script>
