<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>P₄O₁₀ 分子结构 - 3D 模型</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: white;
    }
  </style>
</head>
<body>
  <!-- 引入 Three.js 核心库 -->
  <script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="libs/CSS2DRenderer.js"></script>
<script>window.OrbitControls=THREE.OrbitControls;window.CSS2DRenderer=THREE.CSS2DRenderer;window.CSS2DObject=THREE.CSS2DObject;</script>
<script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-jserr',String(e.message).slice(0,120))},true);</script>
<script>

    // ---------- 初始化场景 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    // ---------- 初始化相机 ----------
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(7.5, 5.0, 9.0);
    camera.lookAt(0, 0, 0);

    // ---------- 初始化 WebGL渲染器 ----------
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      alpha: false 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0xffffff, 1);
    document.body.appendChild(renderer.domElement);

    // ---------- 控制器 ----------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.7;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.target.set(0, 0, 0);
    controls.minPolarAngle = 0;
    controls.maxPolarAngle = Math.PI;
    controls.update();

    // ---------- 光照设置 ----------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    
    const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
    directionalLight1.position.set(1, 2, 1.5);
    scene.add(directionalLight1);
    
    const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight2.position.set(-0.8, -0.5, -1);
    scene.add(directionalLight2);
    
    const directionalLight3 = new THREE.DirectionalLight(0xffffff, 0.4);
    directionalLight3.position.set(0, 1.8, 0.2);
    scene.add(directionalLight3);
    
    const backLight = new THREE.DirectionalLight(0xffffff, 0.35);
    backLight.position.set(-0.5, -1, 0.8);
    scene.add(backLight);

    // ---------- 构建 P₄O₁₀ 分子 ----------
    const moleculeGroup = new THREE.Group();
    
    // ===== P₄O₆ 基础结构（不变）=====
    
    const ppDistance = 3.8;
    const scaleFactor = ppDistance / Math.sqrt(8);
    
    const rawPhosphorusPositions = [
      new THREE.Vector3( 1,  1,  1),
      new THREE.Vector3( 1, -1, -1),
      new THREE.Vector3(-1,  1, -1),
      new THREE.Vector3(-1, -1,  1)
    ];
    
    const phosphorusPositions = rawPhosphorusPositions.map(v => v.clone().multiplyScalar(scaleFactor));
    
    const center = new THREE.Vector3(0, 0, 0);
    const oxygenOffsetFactor = 0.55;
    
    const edgeIndices = [
      [0, 1], [0, 2], [0, 3],
      [1, 2], [1, 3], [2, 3]
    ];
    
    const bridgeOxygenPositions = [];
    edgeIndices.forEach(([i, j]) => {
      const pA = phosphorusPositions[i];
      const pB = phosphorusPositions[j];
      const midPoint = new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5);
      const outwardDirection = new THREE.Vector3().subVectors(midPoint, center).normalize();
      const oxygenPos = midPoint.clone().add(outwardDirection.clone().multiplyScalar(oxygenOffsetFactor));
      bridgeOxygenPositions.push(oxygenPos);
    });
    
    // 磷原子（不变）
    const phosphorusColor = 0xe67e22;
    const phosphorusRadius = 0.58;
    const phosphorusSegments = 48;
    
    phosphorusPositions.forEach((pos) => {
      const geometry = new THREE.SphereGeometry(phosphorusRadius, phosphorusSegments, phosphorusSegments);
      const material = new THREE.MeshStandardMaterial({
        color: phosphorusColor,
        roughness: 0.3,
        metalness: 0.15,
        emissive: new THREE.Color(0x331100)
      });
      const atom = new THREE.Mesh(geometry, material);
      atom.position.copy(pos);
      moleculeGroup.add(atom);
    });
    
    // 桥氧原子（不变）
    const bridgeOxygenColor = 0xe74c3c;
    const bridgeOxygenRadius = 0.42;
    const oxygenSegments = 48;
    
    bridgeOxygenPositions.forEach((pos) => {
      const geometry = new THREE.SphereGeometry(bridgeOxygenRadius, oxygenSegments, oxygenSegments);
      const material = new THREE.MeshStandardMaterial({
        color: bridgeOxygenColor,
        roughness: 0.3,
        metalness: 0.1,
        emissive: new THREE.Color(0x220000)
      });
      const atom = new THREE.Mesh(geometry, material);
      atom.position.copy(pos);
      moleculeGroup.add(atom);
    });
    
    // 单键参数
    const singleBondColor = 0xb0b0b0;
    const singleBondRadius = 0.09;
    const bondSegments = 8;
    
    // 通用单键创建函数
    function createSingleBond(posA, posB) {
      const direction = new THREE.Vector3().subVectors(posB, posA);
      const length = direction.length();
      const midPoint = new THREE.Vector3().addVectors(posA, posB).multiplyScalar(0.5);
      
      const geometry = new THREE.CylinderGeometry(singleBondRadius, singleBondRadius, length, bondSegments);
      const material = new THREE.MeshStandardMaterial({
        color: singleBondColor,
        roughness: 0.55,
        metalness: 0.25,
        emissive: new THREE.Color(0x000000)
      });
      
      const cylinder = new THREE.Mesh(geometry, material);
      cylinder.position.copy(midPoint);
      
      cylinder.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.clone().normalize()
      );
      
      return cylinder;
    }
    
    // 创建 P-O(桥氧) 单键
    edgeIndices.forEach(([pIndex1, pIndex2], edgeIndex) => {
      const oxygenPos = bridgeOxygenPositions[edgeIndex];
      const phosphorusPos1 = phosphorusPositions[pIndex1];
      const phosphorusPos2 = phosphorusPositions[pIndex2];
      
      const bond1 = createSingleBond(phosphorusPos1, oxygenPos);
      moleculeGroup.add(bond1);
      
      const bond2 = createSingleBond(phosphorusPos2, oxygenPos);
      moleculeGroup.add(bond2);
    });
    
    // ===== P₄O₁₀ 新增：4个端基氧原子（P=O双键） =====
    
    const terminalOxygenColor = 0xc0392b;
    const terminalOxygenRadius = 0.44;     // 恢复原来的大小
    
    // 双键参数
    const doubleBondColor = 0x909090;
    const doubleBondRadius = 0.05;         // 每根棍较细
    const doubleBondSpacing = 0.18;        // 两根棍之间的间距
    
    // 端基氧位置：键长比单键稍短
    // 桥氧单键键长约为1.6，双键设为1.4左右
    const terminalOxygenPositions = [];
    phosphorusPositions.forEach((pPos) => {
      const dirFromCenter = new THREE.Vector3().subVectors(pPos, center).normalize();
      const terminalBondLength = 1.4;      // 比单键(~1.6)稍短
      const terminalOpos = pPos.clone().add(dirFromCenter.clone().multiplyScalar(terminalBondLength));
      terminalOxygenPositions.push(terminalOpos);
    });
    
    // 创建端基氧原子
    terminalOxygenPositions.forEach((pos) => {
      const geometry = new THREE.SphereGeometry(terminalOxygenRadius, oxygenSegments, oxygenSegments);
      const material = new THREE.MeshStandardMaterial({
        color: terminalOxygenColor,
        roughness: 0.3,
        metalness: 0.1,
        emissive: new THREE.Color(0x220000)
      });
      const atom = new THREE.Mesh(geometry, material);
      atom.position.copy(pos);
      moleculeGroup.add(atom);
    });
    
    // 创建双键（两根平行棍）
    function createDoubleBond(posA, posB) {
      const direction = new THREE.Vector3().subVectors(posB, posA).normalize();
      
      let perpDir;
      if (Math.abs(direction.x) < 0.9) {
        perpDir = new THREE.Vector3(1, 0, 0).cross(direction).normalize();
      } else {
        perpDir = new THREE.Vector3(0, 1, 0).cross(direction).normalize();
      }
      
      const group = new THREE.Group();
      
      // 第一根棍
      const offset1 = perpDir.clone().multiplyScalar(doubleBondSpacing / 2);
      const start1 = posA.clone().add(offset1);
      const end1 = posB.clone().add(offset1);
      const bondVector1 = new THREE.Vector3().subVectors(end1, start1);
      const bondMid1 = new THREE.Vector3().addVectors(start1, end1).multiplyScalar(0.5);
      
      const geom1 = new THREE.CylinderGeometry(doubleBondRadius, doubleBondRadius, bondVector1.length(), bondSegments);
      const mat1 = new THREE.MeshStandardMaterial({
        color: doubleBondColor,
        roughness: 0.55,
        metalness: 0.25,
        emissive: new THREE.Color(0x000000)
      });
      const cylinder1 = new THREE.Mesh(geom1, mat1);
      cylinder1.position.copy(bondMid1);
      cylinder1.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        bondVector1.clone().normalize()
      );
      group.add(cylinder1);
      
      // 第二根棍
      const offset2 = perpDir.clone().multiplyScalar(-doubleBondSpacing / 2);
      const start2 = posA.clone().add(offset2);
      const end2 = posB.clone().add(offset2);
      const bondVector2 = new THREE.Vector3().subVectors(end2, start2);
      const bondMid2 = new THREE.Vector3().addVectors(start2, end2).multiplyScalar(0.5);
      
      const geom2 = new THREE.CylinderGeometry(doubleBondRadius, doubleBondRadius, bondVector2.length(), bondSegments);
      const mat2 = new THREE.MeshStandardMaterial({
        color: doubleBondColor,
        roughness: 0.55,
        metalness: 0.25,
        emissive: new THREE.Color(0x000000)
      });
      const cylinder2 = new THREE.Mesh(geom2, mat2);
      cylinder2.position.copy(bondMid2);
      cylinder2.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        bondVector2.clone().normalize()
      );
      group.add(cylinder2);
      
      return group;
    }
    
    // 创建 P=O(端氧) 双键
    phosphorusPositions.forEach((pPos, index) => {
      const terminalOpos = terminalOxygenPositions[index];
      const doubleBond = createDoubleBond(pPos, terminalOpos);
      moleculeGroup.add(doubleBond);
    });
    
    scene.add(moleculeGroup);
    
    // ---------- 动画循环 ----------
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    
    animate();
    
    // ---------- 窗口大小自适应 ----------
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    console.log('P₄O₁₀ 分子结构已加载。端氧大小已恢复，P=O双键键长比单键稍短。');
  </script>
