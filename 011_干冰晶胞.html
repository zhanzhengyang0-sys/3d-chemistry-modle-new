<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>CO₂ 晶胞 · 极简触屏版</title>
    <style>
        /* 彻底极简：无任何冗余文本块，只保留必要的触控UI元素 */
        body {
            margin: 0;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif;
            background: white;
            touch-action: pan-y pinch-zoom;
        }
        
        /* 极简颜色状态指示器 (半透明极小胶囊) */
        .mini-status {
            position: absolute;
            bottom: 72px;
            right: 14px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(6px);
            padding: 3px 10px;
            border-radius: 28px;
            font-size: 10px;
            font-weight: 500;
            border: 0.5px solid rgba(0,0,0,0.1);
            box-shadow: 0 1px 6px rgba(0,0,0,0.03);
            color: #1e1f2c;
            pointer-events: none;
            z-index: 150;
            font-family: monospace;
        }
        .mini-status span {
            font-weight: 700;
            color: #4a1a6a;
        }
        
        /* 底部选色板 + 重置开关 —— 极致轻薄设计，厚度最小化 */
        #color-palette {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            padding: 4px 16px;
            border-radius: 48px;
            display: flex;
            gap: 16px;
            border: 0.5px solid rgba(0,0,0,0.12);
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            z-index: 200;
            align-items: center;
            /* 极致轻薄 */
            line-height: 1;
        }
        
        /* 触屏圆形色块 — 稍小且扁，降低整体厚度感 */
        .color-option {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 1px 5px rgba(0,0,0,0.15);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            will-change: transform;
        }
        
        .color-option:active {
            transform: scale(0.94);
        }
        
        .color-option.selected {
            border: 2.5px solid #ffdf8c;
            transform: scale(1.02);
            box-shadow: 0 0 0 1.5px rgba(255,240,150,0.6);
        }
        
        /* 重置开关样式 — 极薄，与调色板无缝融合 */
        .reset-btn {
            background: rgba(35, 38, 52, 0.8);
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(255,255,245,0.3);
            border-radius: 32px;
            padding: 4px 12px;
            margin-left: 6px;
            font-size: 12px;
            font-weight: 500;
            color: #f2f2f7;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.2px;
            background-color: #2c2f3c;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            font-family: system-ui, monospace;
            line-height: 1.2;
        }
        
        .reset-btn:active {
            transform: scale(0.96);
            background-color: #1e212e;
        }
        
        /* 移动端适配：保持极致轻薄，但可点区域舒适 */
        @media (max-width: 768px) {
            .color-option {
                width: 40px;
                height: 40px;
            }
            #color-palette {
                padding: 4px 18px;
                gap: 18px;
                bottom: 14px;
            }
            .mini-status {
                bottom: 78px;
                font-size: 9px;
                padding: 2px 8px;
            }
            .reset-btn {
                padding: 4px 12px;
                font-size: 12px;
                margin-left: 8px;
            }
        }
        
        /* 四个深邃实色 — 与分子变色时完全一致的色值 */
        #color-1 { background-color: #4a1a6a; } /* 葡萄紫 */
        #color-2 { background-color: #0a2a6a; } /* 深海蓝 */
        #color-3 { background-color: #6a0000; } /* 血红 */
        #color-4 { background-color: #1a4a1a; } /* 深绿 */
        
        /* 极隐晦小提示，依然轻薄不干扰 */
        .hint-tiny {
            position: absolute;
            bottom: 68px;
            left: 14px;
            background: rgba(235, 235, 245, 0.5);
            backdrop-filter: blur(3px);
            padding: 2px 8px;
            border-radius: 28px;
            font-size: 8.5px;
            font-weight: 400;
            color: #5a5a6e;
            border: 0.5px solid #d4d4df;
            opacity: 0.55;
            pointer-events: none;
            z-index: 100;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
    </head>
<body>
    <!-- 无任何多余板块: 极简UI符合要求 -->
    <div class="mini-status">
        🎨 <span id="current-color-label">葡萄紫</span>
    </div>
    <div class="hint-tiny">
        ⚡ 点色块 → 点分子
    </div>
    
    <!-- 调色板 + 重置开关一体化，超薄同框 -->
    <div id="color-palette">
        <div id="color-1" class="color-option selected" title="葡萄紫"></div>
        <div id="color-2" class="color-option" title="深海蓝"></div>
        <div id="color-3" class="color-option" title="血红"></div>
        <div id="color-4" class="color-option" title="深绿"></div>
        <div id="reset-all-btn" class="reset-btn" title="重置所有分子颜色">⟳ 重置</div>
    </div>

    <script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="libs/CSS2DRenderer.js"></script>
<script>window.OrbitControls=THREE.OrbitControls;window.CSS2DRenderer=THREE.CSS2DRenderer;window.CSS2DObject=THREE.CSS2DObject;</script>
<script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-jserr',String(e.message).slice(0,120))},true);</script>
<script>

        // ---------- 初始化场景 (白色纯背景) ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        
        // 相机: 稍微调小视角，让整体图形视觉上略小且舒适
        const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8.2, 6.4, 11.0);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0xffffff, 1.0);
        if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
        if (renderer.toneMapping !== undefined) {
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.28;
        }
        document.body.appendChild(renderer.domElement);
        
        // 轨道控制 (触屏完全兼容)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.07;
        controls.rotateSpeed = 1.3;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.9;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.touchRotate = true;
        controls.touchZoom = true;
        controls.touchPan = true;
        controls.target.set(0, 0, 0);
        
        // ---------- 光源系统 (保留质感) ----------
        const ambientLight = new THREE.AmbientLight(0x60687a, 0.65);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xfffaf0, 2.1);
        mainLight.position.set(6, 9, 7);
        scene.add(mainLight);
        
        const fillLight = new THREE.DirectionalLight(0xcbd6ff, 1.25);
        fillLight.position.set(-5, 4, -6);
        scene.add(fillLight);
        
        const rimLight = new THREE.PointLight(0xbac8f0, 1.0);
        rimLight.position.set(-3, 1.5, -9);
        scene.add(rimLight);
        
        const topFill = new THREE.PointLight(0xe5edff, 0.95);
        topFill.position.set(2, 10, 3);
        scene.add(topFill);
        
        const bottomFill = new THREE.PointLight(0xb5c4e8, 0.7);
        bottomFill.position.set(0, -8, 2);
        scene.add(bottomFill);
        
        const accentLight = new THREE.PointLight(0xffefe0, 0.85);
        accentLight.position.set(4, 3, 7.5);
        scene.add(accentLight);
        
        const backRim = new THREE.PointLight(0x9eb0da, 0.9);
        backRim.position.set(-4, 2, -9.5);
        scene.add(backRim);
        
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xc0cce8, 0.5);
        scene.add(hemiLight);
        
        // ---------- 晶胞框架 (黑灰色棱边) ----------
        const boxSize = 5.2;
        const half = boxSize / 2;
        const edgeMaterial = new THREE.MeshStandardMaterial({
            color: 0x2d3345,
            roughness: 0.42,
            metalness: 0.32,
            emissive: 0x000000,
        });
        const edgeRadius = 0.07;
        const edgeGroup = new THREE.Group();
        
        const cornersPos = [
            new THREE.Vector3(-half, -half, -half), new THREE.Vector3( half, -half, -half),
            new THREE.Vector3( half, -half,  half), new THREE.Vector3(-half, -half,  half),
            new THREE.Vector3(-half,  half, -half), new THREE.Vector3( half,  half, -half),
            new THREE.Vector3( half,  half,  half), new THREE.Vector3(-half,  half,  half)
        ];
        
        const edgeIndices = [
            [0,1], [1,2], [2,3], [3,0], [4,5], [5,6], [6,7], [7,4], [0,4], [1,5], [2,6], [3,7]
        ];
        
        edgeIndices.forEach(idxPair => {
            const p1 = cornersPos[idxPair[0]];
            const p2 = cornersPos[idxPair[1]];
            const direction = new THREE.Vector3().subVectors(p2, p1);
            const length = direction.length();
            const cylinder = new THREE.Mesh(
                new THREE.CylinderGeometry(edgeRadius, edgeRadius, length, 12),
                edgeMaterial
            );
            const center = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            cylinder.position.copy(center);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), direction.clone().normalize());
            edgeGroup.add(cylinder);
        });
        
        const cornerCapMat = new THREE.MeshStandardMaterial({ color: 0x3f455c, roughness: 0.38, metalness: 0.25 });
        cornersPos.forEach(pos => {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 20), cornerCapMat);
            sphere.position.copy(pos);
            edgeGroup.add(sphere);
        });
        scene.add(edgeGroup);
        
        // ---------- CO₂ 分子参数 ----------
        const bondLength = 0.98;
        const carbonRadius = 0.73;
        const oxygenRadius = 0.61;
        
        // 原始配色 (碳:深海蓝 / 氧:血红)
        const originalCarbonColor = new THREE.Color(0x0a2a5a);
        const originalOxygenColor = new THREE.Color(0x6a0000);
        
        // 选色板对应四种纯色
        const palettePurple = new THREE.Color(0x4a1a6a);
        const paletteBlue   = new THREE.Color(0x0a2a6a);
        const paletteRed    = new THREE.Color(0x6a0000);
        const paletteGreen  = new THREE.Color(0x1a4a1a);
        
        let currentSelectedColor = palettePurple.clone();
        
        const bondMaterial = new THREE.MeshStandardMaterial({
            color: 0xaa88dd,
            roughness: 0.4,
            metalness: 0.08,
            emissive: 0x1f1035,
            emissiveIntensity: 0.04
        });
        
        const moleculeGroups = [];
        const moleculeOriginalColorsMap = new Map();
        const moleculeColorChangedMap = new Map();
        
        // 基础线性分子(默认沿X轴)
        function createLinearCO2(carbonCol, oxygenCol) {
            const group = new THREE.Group();
            const atomsList = [];
            
            const carbonMat = new THREE.MeshStandardMaterial({ color: carbonCol, roughness: 0.26, metalness: 0.18, emissiveIntensity: 0.02 });
            const carbonSphere = new THREE.Mesh(new THREE.SphereGeometry(carbonRadius, 72, 48), carbonMat);
            carbonSphere.position.set(0, 0, 0);
            group.add(carbonSphere);
            atomsList.push(carbonSphere);
            
            const oxMatPos = new THREE.MeshStandardMaterial({ color: oxygenCol, roughness: 0.28, metalness: 0.12, emissiveIntensity: 0.01 });
            const oxygenPos = new THREE.Mesh(new THREE.SphereGeometry(oxygenRadius, 72, 48), oxMatPos);
            oxygenPos.position.set(bondLength, 0, 0);
            group.add(oxygenPos);
            atomsList.push(oxygenPos);
            
            const oxMatNeg = new THREE.MeshStandardMaterial({ color: oxygenCol, roughness: 0.28, metalness: 0.12 });
            const oxygenNeg = new THREE.Mesh(new THREE.SphereGeometry(oxygenRadius, 72, 48), oxMatNeg);
            oxygenNeg.position.set(-bondLength, 0, 0);
            group.add(oxygenNeg);
            atomsList.push(oxygenNeg);
            
            const cylinderGeo = new THREE.CylinderGeometry(bondLength * 0.075, bondLength * 0.075, bondLength, 12);
            const bondCyl = new THREE.Mesh(cylinderGeo, bondMaterial);
            bondCyl.rotation.z = Math.PI / 2;
            group.add(bondCyl);
            
            return { group, atoms: atomsList };
        }
        
        // 沿任意方向的分子 (面心)
        function createOrientedCO2(centerPos, directionVec, carbonCol, oxygenCol) {
            const dirNorm = directionVec.clone().normalize();
            const group = new THREE.Group();
            const atomsList = [];
            
            const carbonMat = new THREE.MeshStandardMaterial({ color: carbonCol, roughness: 0.26, metalness: 0.18 });
            const carbonSphere = new THREE.Mesh(new THREE.SphereGeometry(carbonRadius, 72, 48), carbonMat);
            carbonSphere.position.set(0, 0, 0);
            group.add(carbonSphere);
            atomsList.push(carbonSphere);
            
            const oxMat1 = new THREE.MeshStandardMaterial({ color: oxygenCol, roughness: 0.28, metalness: 0.12 });
            const ox1 = new THREE.Mesh(new THREE.SphereGeometry(oxygenRadius, 72, 48), oxMat1);
            ox1.position.copy(dirNorm.clone().multiplyScalar(bondLength));
            group.add(ox1);
            atomsList.push(ox1);
            
            const oxMat2 = new THREE.MeshStandardMaterial({ color: oxygenCol, roughness: 0.28, metalness: 0.12 });
            const ox2 = new THREE.Mesh(new THREE.SphereGeometry(oxygenRadius, 72, 48), oxMat2);
            ox2.position.copy(dirNorm.clone().multiplyScalar(-bondLength));
            group.add(ox2);
            atomsList.push(ox2);
            
            const cylinderGeo = new THREE.CylinderGeometry(bondLength * 0.075, bondLength * 0.075, bondLength, 12);
            const cylinder = new THREE.Mesh(cylinderGeo, bondMaterial);
            const upDir = new THREE.Vector3(0, 1, 0);
            const quat = new THREE.Quaternion().setFromUnitVectors(upDir, dirNorm);
            cylinder.applyQuaternion(quat);
            group.add(cylinder);
            
            group.position.copy(centerPos);
            return { group, atoms: atomsList };
        }
        
        const dirX = new THREE.Vector3(1, 1, 1).normalize();
        const dirY = new THREE.Vector3(1, 1, -1).normalize();
        const dirZ = new THREE.Vector3(1, -1, 1).normalize();
        
        const faceCentersList = [
            { pos: new THREE.Vector3( half, 0, 0), dir: dirX },
            { pos: new THREE.Vector3(-half, 0, 0), dir: dirX },
            { pos: new THREE.Vector3(0,  half, 0), dir: dirY },
            { pos: new THREE.Vector3(0, -half, 0), dir: dirY },
            { pos: new THREE.Vector3(0, 0,  half), dir: dirZ },
            { pos: new THREE.Vector3(0, 0, -half), dir: dirZ }
        ];
        
        faceCentersList.forEach(item => {
            const { group, atoms } = createOrientedCO2(item.pos, item.dir, originalCarbonColor, originalOxygenColor);
            scene.add(group);
            moleculeGroups.push(group);
            moleculeOriginalColorsMap.set(group.id, {
                carbonColor: originalCarbonColor.clone(),
                oxygenColor: originalOxygenColor.clone(),
                atoms: atoms
            });
            moleculeColorChangedMap.set(group.id, false);
        });
        
        const cornerDirVec = new THREE.Vector3(-1, 1, 1).normalize();
        cornersPos.forEach(cornerPos => {
            const { group, atoms } = createLinearCO2(originalCarbonColor, originalOxygenColor);
            const quatRot = new THREE.Quaternion().setFromUnitVectors(
                new THREE.Vector3(1, 0, 0),
                cornerDirVec
            );
            group.applyQuaternion(quatRot);
            group.position.copy(cornerPos);
            scene.add(group);
            moleculeGroups.push(group);
            moleculeOriginalColorsMap.set(group.id, {
                carbonColor: originalCarbonColor.clone(),
                oxygenColor: originalOxygenColor.clone(),
                atoms: atoms
            });
            moleculeColorChangedMap.set(group.id, false);
        });
        
        // 极淡地面反射板
        const softPlaneMat = new THREE.MeshStandardMaterial({
            color: 0xf0f2f9,
            transparent: true,
            opacity: 0.045,
            side: THREE.DoubleSide,
            roughness: 0.9
        });
        const groundDisc = new THREE.Mesh(new THREE.CircleGeometry(12, 24), softPlaneMat);
        groundDisc.rotation.x = -Math.PI / 2;
        groundDisc.position.y = -half - 0.65;
        scene.add(groundDisc);
        
        // 重置所有分子颜色
        function resetAllMolecules() {
            moleculeGroups.forEach(group => {
                const groupId = group.id;
                const originalInfo = moleculeOriginalColorsMap.get(groupId);
                if (!originalInfo) return;
                
                group.children.forEach(child => {
                    if (child.isMesh && child.geometry.type === 'SphereGeometry') {
                        const localPos = child.position.clone();
                        const distToCenter = Math.sqrt(localPos.x*localPos.x + localPos.y*localPos.y + localPos.z*localPos.z);
                        let targetColor;
                        if (distToCenter < 0.55) {
                            targetColor = originalInfo.carbonColor;
                        } else {
                            targetColor = originalInfo.oxygenColor;
                        }
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => mat.color.set(targetColor));
                        } else {
                            child.material.color.set(targetColor);
                        }
                    }
                });
                moleculeColorChangedMap.set(groupId, false);
            });
        }
        
        // 射线交互
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        
        function handlePick(event) {
            if (event.cancelable) event.preventDefault();
            
            const rect = renderer.domElement.getBoundingClientRect();
            let clientX, clientY;
            if (event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            
            pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length === 0) return;
            
            let hitGroup = null;
            let hitObject = intersects[0].object;
            while (hitObject.parent) {
                if (moleculeGroups.includes(hitObject.parent)) {
                    hitGroup = hitObject.parent;
                    break;
                }
                hitObject = hitObject.parent;
            }
            if (!hitGroup) return;
            
            const groupId = hitGroup.id;
            const isChanged = moleculeColorChangedMap.get(groupId) || false;
            const originalInfo = moleculeOriginalColorsMap.get(groupId);
            if (!originalInfo) return;
            
            if (!isChanged) {
                hitGroup.children.forEach(child => {
                    if (child.isMesh && child.geometry.type === 'SphereGeometry') {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => mat.color.set(currentSelectedColor));
                        } else {
                            child.material.color.set(currentSelectedColor);
                        }
                    }
                });
                moleculeColorChangedMap.set(groupId, true);
            } else {
                hitGroup.children.forEach(child => {
                    if (child.isMesh && child.geometry.type === 'SphereGeometry') {
                        const localPos = child.position.clone();
                        const distToCenter = Math.sqrt(localPos.x*localPos.x + localPos.y*localPos.y + localPos.z*localPos.z);
                        let targetColor;
                        if (distToCenter < 0.55) {
                            targetColor = originalInfo.carbonColor;
                        } else {
                            targetColor = originalInfo.oxygenColor;
                        }
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => mat.color.set(targetColor));
                        } else {
                            child.material.color.set(targetColor);
                        }
                    }
                });
                moleculeColorChangedMap.set(groupId, false);
            }
        }
        
        renderer.domElement.addEventListener('click', handlePick);
        renderer.domElement.addEventListener('touchstart', handlePick, { passive: false });
        
        // 选色板逻辑
        const colorElem1 = document.getElementById('color-1');
        const colorElem2 = document.getElementById('color-2');
        const colorElem3 = document.getElementById('color-3');
        const colorElem4 = document.getElementById('color-4');
        const resetBtn = document.getElementById('reset-all-btn');
        const colorLabelSpan = document.getElementById('current-color-label');
        
        function clearSelectedHighlight() {
            colorElem1.classList.remove('selected');
            colorElem2.classList.remove('selected');
            colorElem3.classList.remove('selected');
            colorElem4.classList.remove('selected');
        }
        
        function setupColorPicker(element, colorHex, colorName, hexValue) {
            const handler = (e) => {
                if (e.cancelable) e.preventDefault();
                clearSelectedHighlight();
                element.classList.add('selected');
                currentSelectedColor.copy(colorHex);
                colorLabelSpan.textContent = colorName;
                colorLabelSpan.style.color = hexValue;
            };
            element.addEventListener('click', handler);
            element.addEventListener('touchstart', handler, { passive: false });
        }
        
        setupColorPicker(colorElem1, palettePurple, '葡萄紫', '#4a1a6a');
        setupColorPicker(colorElem2, paletteBlue,   '深海蓝', '#0a2a6a');
        setupColorPicker(colorElem3, paletteRed,    '血红',   '#6a0000');
        setupColorPicker(colorElem4, paletteGreen,  '深绿',   '#1a4a1a');
        
        const resetHandler = (e) => {
            if (e.cancelable) e.preventDefault();
            resetAllMolecules();
        };
        resetBtn.addEventListener('click', resetHandler);
        resetBtn.addEventListener('touchstart', resetHandler, { passive: false });
        
        colorElem1.classList.add('selected');
        currentSelectedColor.copy(palettePurple);
        colorLabelSpan.textContent = '葡萄紫';
        colorLabelSpan.style.color = '#4a1a6a';
        
        // 极简中心光晕
        const centerGlowMat = new THREE.MeshStandardMaterial({ color: 0xfafcff, emissive: 0xccdaff, emissiveIntensity: 0.06, transparent: true, opacity: 0.15 });
        const centerHint = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), centerGlowMat);
        centerHint.position.set(0, 0, 0);
        scene.add(centerHint);
        
        const lightDotMat = new THREE.MeshStandardMaterial({ color: 0x4e5670, emissive: 0x202530, emissiveIntensity: 0.1 });
        cornersPos.forEach(pos => {
            const dot = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), lightDotMat);
            dot.position.copy(pos);
            scene.add(dot);
        });
        
        // 动画
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', onWindowResize);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        const paletteDiv = document.getElementById('color-palette');
        paletteDiv.addEventListener('touchstart', (e) => { e.stopPropagation(); }, false);
        paletteDiv.addEventListener('click', (e) => { e.stopPropagation(); }, false);
        
        setTimeout(() => {
            controls.target.set(0, 0, 0);
            controls.update();
        }, 50);
    </script>
