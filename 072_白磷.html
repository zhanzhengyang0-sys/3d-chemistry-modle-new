<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>白磷分子结构 (P₄) - 3D 模型</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: white;
    }
  </style>
</head>
<body>
  <!-- 引入 Three.js 核心库 -->
  <script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="libs/CSS2DRenderer.js"></script>
<script>window.OrbitControls=THREE.OrbitControls;window.CSS2DRenderer=THREE.CSS2DRenderer;window.CSS2DObject=THREE.CSS2DObject;</script>
<script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-jserr',String(e.message).slice(0,120))},true);</script>
<script>

    // ---------- 初始化场景 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    // ---------- 初始化相机 ----------
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    // 调整相机距离到适中位置
    camera.position.set(5.8, 4.0, 7.0);
    camera.lookAt(0, 0, 0);

    // ---------- 初始化 WebGL渲染器 ----------
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      alpha: false 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0xffffff, 1);
    document.body.appendChild(renderer.domElement);

    // ---------- 控制器 (禁止自动旋转) ----------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.7;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.target.set(0, 0, 0);
    controls.update();

    // ---------- 光照设置 ----------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);
    
    const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
    directionalLight1.position.set(1, 2, 1.5);
    scene.add(directionalLight1);
    
    const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight2.position.set(-0.8, -0.5, -1);
    scene.add(directionalLight2);
    
    const directionalLight3 = new THREE.DirectionalLight(0xffffff, 0.4);
    directionalLight3.position.set(0, 1.8, 0.2);
    scene.add(directionalLight3);

    // ---------- 构建白磷分子 (P₄) ----------
    const moleculeGroup = new THREE.Group();
    
    // 调整为适中的分子尺寸：边长1.85，介于之前两个版本之间
    const edgeLength = 1.85;
    const scaleFactor = edgeLength / Math.sqrt(8);
    
    // 定义四个顶点的原始坐标
    const rawPositions = [
      new THREE.Vector3( 1,  1,  1),
      new THREE.Vector3( 1, -1, -1),
      new THREE.Vector3(-1,  1, -1),
      new THREE.Vector3(-1, -1,  1)
    ];
    
    // 计算实际顶点位置
    const positions = rawPositions.map(v => v.clone().multiplyScalar(scaleFactor));
    
    // ----- 磷原子参数 -----
    const atomColor = 0xe67e22; // 橙红色
    // 原子半径适中
    const atomRadius = 0.58;
    const atomSegments = 48;
    
    // 创建四个磷原子
    positions.forEach((pos) => {
      const geometry = new THREE.SphereGeometry(atomRadius, atomSegments, atomSegments);
      const material = new THREE.MeshStandardMaterial({
        color: atomColor,
        roughness: 0.3,
        metalness: 0.15,
        emissive: new THREE.Color(0x331100)
      });
      const atom = new THREE.Mesh(geometry, material);
      atom.position.copy(pos);
      moleculeGroup.add(atom);
    });
    
    // ----- 化学键（棱边）参数 -----
    const bondColor = 0xd5d5d5; // 灰白色
    // 键的半径适中，不粗不细
    const bondRadius = 0.105;
    const bondSegments = 8;
    
    // 顶点索引组合
    const edgeIndices = [
      [0, 1], [0, 2], [0, 3],
      [1, 2], [1, 3], [2, 3]
    ];
    
    // 辅助函数：创建两点之间的圆柱体
    function createBond(posA, posB) {
      const direction = new THREE.Vector3().subVectors(posB, posA);
      const length = direction.length();
      const midPoint = new THREE.Vector3().addVectors(posA, posB).multiplyScalar(0.5);
      
      const geometry = new THREE.CylinderGeometry(bondRadius, bondRadius, length, bondSegments);
      const material = new THREE.MeshStandardMaterial({
        color: bondColor,
        roughness: 0.55,
        metalness: 0.3,
        emissive: new THREE.Color(0x000000)
      });
      
      const cylinder = new THREE.Mesh(geometry, material);
      cylinder.position.copy(midPoint);
      
      cylinder.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.clone().normalize()
      );
      
      return cylinder;
    }
    
    // 创建所有化学键
    edgeIndices.forEach(([i, j]) => {
      const bond = createBond(positions[i], positions[j]);
      moleculeGroup.add(bond);
    });
    
    // 将分子组添加到场景
    scene.add(moleculeGroup);
    
    // ---------- 动画循环 ----------
    function animate() {
      requestAnimationFrame(animate);
      
      // 更新控制器
      controls.update();
      
      // 渲染场景
      renderer.render(scene, camera);
    }
    
    animate();
    
    // ---------- 窗口大小自适应 ----------
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    console.log('白磷分子结构 (P₄) 已加载。大小适中，纯白背景，无文字。');
  </script>
