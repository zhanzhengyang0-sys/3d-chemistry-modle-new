<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-冠-4</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; }
        #info {
            position: absolute; bottom: 30px; width: 100%; text-align: center;
            color: #333; font-family: sans-serif; font-size: 24px; font-weight: bold;
            pointer-events: none;
        }
    </style>
    </head>
<body>
    <div id="info">12-冠-4</div>

    <script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="libs/CSS2DRenderer.js"></script>
<script>window.OrbitControls=THREE.OrbitControls;window.CSS2DRenderer=THREE.CSS2DRenderer;window.CSS2DObject=THREE.CSS2DObject;</script>
<script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-jserr',String(e.message).slice(0,120))},true);</script>
<script>

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        // ==========================================
        // 【调整视角】：拉远相机（Z从 12 改为 16），并略微抬高视角
        // ==========================================
        camera.position.set(0, 4, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(5, 10, 7);
        scene.add(light);
        const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
        backLight.position.set(-5, 0, -5);
        scene.add(backLight);

        // 1. 计算标准的 12-冠-4 骨架位置
        const baseAtoms = [];
        const baseRadius = 2.7; 
        const zAmp = 0.7;

        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
            const isOxygen = (i % 3 === 2);
            const z = zAmp * Math.sin(angle * 3 + (isOxygen ? 0.5 : 0));
            
            baseAtoms.push({
                pos: new THREE.Vector3(baseRadius * Math.cos(angle), baseRadius * Math.sin(angle), z),
                type: isOxygen ? 'O' : 'C',
                index: i
            });
        }

        // 2. 创建最终原子数组，并应用绝对均衡逻辑
        const atoms = [];
        for (let i = 0; i < baseAtoms.length; i++) {
            let pos = baseAtoms[i].pos.clone();

            // 自动计算点对点绝对对称中点
            if (i === 11) { 
                // O11，相邻碳是 C10 (索引10) 和 C0 (索引0)
                const pLeft = baseAtoms[10].pos; // C10
                const pRight = baseAtoms[0].pos;  // C0
                
                // 计算左右两个碳原子的中点
                const midPoint = new THREE.Vector3().addVectors(pLeft, pRight).multiplyScalar(0.5);
                const dirToMid = new THREE.Vector3().copy(midPoint).normalize();
                pos.copy(midPoint.clone().add(dirToMid.multiplyScalar(-0.3)));
            }

            if (i === 5) {
                // O5，相邻碳是 C4 (索引4) 和 C6 (索引6)
                const pLeft = baseAtoms[4].pos; // C4
                const pRight = baseAtoms[6].pos; // C6
                
                const midPoint = new THREE.Vector3().addVectors(pLeft, pRight).multiplyScalar(0.5);
                const dirToMid = new THREE.Vector3().copy(midPoint).normalize();
                pos.copy(midPoint.clone().add(dirToMid.multiplyScalar(-0.3)));
            }

            atoms.push({
                pos: pos,
                type: baseAtoms[i].type,
                index: i
            });
        }

        // 3. 渲染主环原子
        const matO = new THREE.MeshStandardMaterial({ color: 0xe04f4f, roughness: 0.3 });
        const matC = new THREE.MeshStandardMaterial({ color: 0x5a5a5a, roughness: 0.4 });
        const matH = new THREE.MeshStandardMaterial({ color: 0x87CEEB, roughness: 0.1 });

        const sphereGeo = new THREE.SphereGeometry(1, 32, 16);

        const rO = 0.90; 
        const rC = 0.90; 
        const rH = 0.65;

        for (let i = 0; i < atoms.length; i++) {
            const isOxygen = atoms[i].type === 'O';
            const r = isOxygen ? rO : rC;
            const mesh = new THREE.Mesh(sphereGeo, isOxygen ? matO : matC);
            mesh.position.copy(atoms[i].pos);
            mesh.scale.set(r, r, r);
            scene.add(mesh);
        }

        // 4. 生成氢原子 (四面体算法，基于最终位置)
        const hGeo = new THREE.SphereGeometry(1, 16, 12);

        for (let i = 0; i < atoms.length; i++) {
            if (atoms[i].type !== 'C') continue;

            const curr = atoms[i].pos;
            const prev = atoms[(i - 1 + 12) % 12].pos;
            const next = atoms[(i + 1) % 12].pos;

            const vecPrev = new THREE.Vector3().copy(prev).sub(curr).normalize();
            const vecNext = new THREE.Vector3().copy(next).sub(curr).normalize();
            
            const avgDir = new THREE.Vector3().copy(vecPrev).add(vecNext).normalize();
            const normal = new THREE.Vector3().crossVectors(vecPrev, vecNext).normalize();

            const bondAngleFactor = 0.577;
            
            const dirH1 = new THREE.Vector3()
                .addScaledVector(avgDir, -1.0)
                .addScaledVector(normal, bondAngleFactor)
                .normalize();

            const dirH2 = new THREE.Vector3()
                .addScaledVector(avgDir, -1.0)
                .addScaledVector(normal, -bondAngleFactor)
                .normalize();

            const hDist = 1.4;
            const hPos1 = curr.clone().add(dirH1.multiplyScalar(hDist));
            const hPos2 = curr.clone().add(dirH2.multiplyScalar(hDist));

            [hPos1, hPos2].forEach(hPos => {
                const mesh = new THREE.Mesh(hGeo, matH);
                mesh.position.copy(hPos);
                mesh.scale.set(rH, rH, rH);
                scene.add(mesh);
            });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
