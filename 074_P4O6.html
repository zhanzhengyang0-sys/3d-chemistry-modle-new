<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>P₄O₆ 分子结构 - 3D 模型</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: white;
    }
  </style>
</head>
<body>
  <!-- 引入 Three.js 核心库 -->
  <script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="libs/CSS2DRenderer.js"></script>
<script>window.OrbitControls=THREE.OrbitControls;window.CSS2DRenderer=THREE.CSS2DRenderer;window.CSS2DObject=THREE.CSS2DObject;</script>
<script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-jserr',String(e.message).slice(0,120))},true);</script>
<script>

    // ---------- 初始化场景 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    // ---------- 初始化相机 ----------
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    // 拉近相机，让分子显示更大
    camera.position.set(6.5, 4.2, 7.5);
    camera.lookAt(0, 0, 0);

    // ---------- 初始化 WebGL渲染器 ----------
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      alpha: false 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0xffffff, 1);
    document.body.appendChild(renderer.domElement);

    // ---------- 控制器 (禁止自动旋转，纵向角度扩展到180度) ----------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.7;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.target.set(0, 0, 0);
    
    // 关键设置：纵向旋转范围设置为0到180度（从顶部到底部全覆盖）
    controls.minPolarAngle = 0;           // 最小极角：0度（正上方俯视）
    controls.maxPolarAngle = Math.PI;     // 最大极角：180度（正下方仰视）
    
    controls.update();

    // ---------- 光照设置 ----------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    
    const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
    directionalLight1.position.set(1, 2, 1.5);
    scene.add(directionalLight1);
    
    const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight2.position.set(-0.8, -0.5, -1);
    scene.add(directionalLight2);
    
    const directionalLight3 = new THREE.DirectionalLight(0xffffff, 0.4);
    directionalLight3.position.set(0, 1.8, 0.2);
    scene.add(directionalLight3);
    
    const backLight = new THREE.DirectionalLight(0xffffff, 0.35);
    backLight.position.set(-0.5, -1, 0.8);
    scene.add(backLight);

    // ---------- 构建 P₄O₆ 分子 ----------
    const moleculeGroup = new THREE.Group();
    
    // 磷原子间距
    const ppDistance = 3.8;
    const scaleFactor = ppDistance / Math.sqrt(8);
    
    // 磷原子的四个顶点坐标
    const rawPhosphorusPositions = [
      new THREE.Vector3( 1,  1,  1),
      new THREE.Vector3( 1, -1, -1),
      new THREE.Vector3(-1,  1, -1),
      new THREE.Vector3(-1, -1,  1)
    ];
    
    // 计算磷原子的实际位置
    const phosphorusPositions = rawPhosphorusPositions.map(v => v.clone().multiplyScalar(scaleFactor));
    
    // 氧原子向外偏移量
    const center = new THREE.Vector3(0, 0, 0);
    const oxygenOffsetFactor = 0.55;
    
    // 6条棱的顶点索引组合
    const edgeIndices = [
      [0, 1], [0, 2], [0, 3],
      [1, 2], [1, 3], [2, 3]
    ];
    
    // 计算氧原子位置
    const oxygenPositions = [];
    edgeIndices.forEach(([i, j]) => {
      const pA = phosphorusPositions[i];
      const pB = phosphorusPositions[j];
      
      const midPoint = new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5);
      const outwardDirection = new THREE.Vector3().subVectors(midPoint, center).normalize();
      const oxygenPos = midPoint.clone().add(outwardDirection.clone().multiplyScalar(oxygenOffsetFactor));
      oxygenPositions.push(oxygenPos);
    });
    
    // ----- 磷原子参数 -----
    const phosphorusColor = 0xe67e22; // 橙红色
    const phosphorusRadius = 0.58;
    const phosphorusSegments = 48;
    
    // 创建四个磷原子
    phosphorusPositions.forEach((pos) => {
      const geometry = new THREE.SphereGeometry(phosphorusRadius, phosphorusSegments, phosphorusSegments);
      const material = new THREE.MeshStandardMaterial({
        color: phosphorusColor,
        roughness: 0.3,
        metalness: 0.15,
        emissive: new THREE.Color(0x331100)
      });
      const atom = new THREE.Mesh(geometry, material);
      atom.position.copy(pos);
      moleculeGroup.add(atom);
    });
    
    // ----- 氧原子参数 -----
    const oxygenColor = 0xe74c3c; // 红色
    const oxygenRadius = 0.42;
    const oxygenSegments = 48;
    
    // 创建六个氧原子
    oxygenPositions.forEach((pos) => {
      const geometry = new THREE.SphereGeometry(oxygenRadius, oxygenSegments, oxygenSegments);
      const material = new THREE.MeshStandardMaterial({
        color: oxygenColor,
        roughness: 0.3,
        metalness: 0.1,
        emissive: new THREE.Color(0x220000)
      });
      const atom = new THREE.Mesh(geometry, material);
      atom.position.copy(pos);
      moleculeGroup.add(atom);
    });
    
    // ----- 化学键参数 -----
    const bondColor = 0xb0b0b0; // 灰白色键
    const bondRadius = 0.09;
    const bondSegments = 8;
    
    // 辅助函数：创建两点之间的圆柱体键
    function createBond(posA, posB) {
      const direction = new THREE.Vector3().subVectors(posB, posA);
      const length = direction.length();
      const midPoint = new THREE.Vector3().addVectors(posA, posB).multiplyScalar(0.5);
      
      const geometry = new THREE.CylinderGeometry(bondRadius, bondRadius, length, bondSegments);
      const material = new THREE.MeshStandardMaterial({
        color: bondColor,
        roughness: 0.55,
        metalness: 0.25,
        emissive: new THREE.Color(0x000000)
      });
      
      const cylinder = new THREE.Mesh(geometry, material);
      cylinder.position.copy(midPoint);
      
      cylinder.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.clone().normalize()
      );
      
      return cylinder;
    }
    
    // 创建所有 P-O 键
    edgeIndices.forEach(([pIndex1, pIndex2], edgeIndex) => {
      const oxygenPos = oxygenPositions[edgeIndex];
      const phosphorusPos1 = phosphorusPositions[pIndex1];
      const phosphorusPos2 = phosphorusPositions[pIndex2];
      
      const bond1 = createBond(phosphorusPos1, oxygenPos);
      moleculeGroup.add(bond1);
      
      const bond2 = createBond(phosphorusPos2, oxygenPos);
      moleculeGroup.add(bond2);
    });
    
    // 将分子组添加到场景
    scene.add(moleculeGroup);
    
    // ---------- 动画循环 ----------
    function animate() {
      requestAnimationFrame(animate);
      
      controls.update();
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    // ---------- 窗口大小自适应 ----------
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    console.log('P₄O₆ 分子结构已加载。显示更大，纵向旋转角度0~180度。');
  </script>
