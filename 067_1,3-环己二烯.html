<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>1,3-环己二烯 · 点击 H 换成彩球 · 隐藏 H</title>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: white;
            touch-action: none;
            position: fixed;
            width: 100%; height: 100%;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        canvas { display: block; touch-action: none; }

        /* 顶部提示 */
        #touch-hint {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #ddd;
            font-size: 12px;
            color: #555;
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            max-width: calc(100vw - 24px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ============================================================
           底部控制面板：flex-wrap 自动换行，窄屏完整可见
           ============================================================ */
        #controls {
            position: absolute;
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            max-width: calc(100vw - 16px);
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid #ccc;
            border-radius: 22px;
            padding: 8px 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 12px;
            z-index: 20;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            pointer-events: auto;
        }

        /* 颜色选择器 */
        .color-picker {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .picker-label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            white-space: nowrap;
        }
        .color-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            transition: transform 0.12s, box-shadow 0.15s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        .color-dot:active { transform: scale(0.88); }
        .color-dot.active {
            border: 3px solid #1a1a1a;
            transform: scale(1.12);
            box-shadow: 0 0 0 2px #ffd966;
        }

        .divider-vertical {
            width: 1px;
            height: 30px;
            background: #d0d0d0;
            flex-shrink: 0;
        }

        /* 隐藏H 复选框 */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding: 4px 6px;
            touch-action: manipulation;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .checkbox-label {
            font-size: 13px;
            color: #333;
            font-weight: 600;
            pointer-events: none;
        }
        .checkbox-custom {
            width: 20px;
            height: 20px;
            border: 2px solid #888;
            border-radius: 3px;
            background-color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            flex-shrink: 0;
            box-sizing: border-box;
            pointer-events: none;
        }
        .checkbox-custom.checked {
            background-color: #1a2b5c;
            border-color: #1a2b5c;
        }
        .checkbox-custom.checked::after {
            content: '';
            display: block;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) translate(-1px, -1px);
        }

        /* ============================================================
           触屏设备（粗指针）: 加大点击目标
           ============================================================ */
        @media (pointer: coarse) {
            .color-dot { width: 34px; height: 34px; }
            .checkbox-custom { width: 24px; height: 24px; }
            .checkbox-label { font-size: 14px; }
            .checkbox-container { padding: 8px 8px; }
            #controls { padding: 10px 14px; }
        }

        /* ============================================================
           窄屏: 控制面板铺满宽度、颜色/复选框各占一行
           ============================================================ */
        @media (max-width: 720px) {
            #controls {
                width: calc(100vw - 16px);
                padding: 10px 12px;
                gap: 8px;
                border-radius: 18px;
            }
            .color-picker {
                width: 100%;
                justify-content: center;
                padding-bottom: 8px;
                border-bottom: 1px solid #eee;
            }
            .color-dots { gap: 8px; }
            .divider-vertical { display: none; }
            .checkbox-container {
                width: 100%;
                justify-content: center;
            }
            #touch-hint { font-size: 11px; padding: 4px 12px; top: 12px; }
        }

        @media (max-width: 420px) {
            #controls { padding: 8px 10px; }
            .color-dot { width: 28px; height: 28px; }
            .color-dots { gap: 6px; }
            .checkbox-label { font-size: 13px; }
        }
    </style>

    <script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script src="libs/CSS2DRenderer.js"></script>
<script>window.OrbitControls=THREE.OrbitControls;window.CSS2DRenderer=THREE.CSS2DRenderer;window.CSS2DObject=THREE.CSS2DObject;</script>
<script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-jserr',String(e.message).slice(0,120))},true);</script>

</head>
<body>
    <div id="touch-hint">👆 点击氢原子 → 变为所选颜色球 · 再点变回氢</div>

    <div id="controls">
        <div class="color-picker">
            <span class="picker-label">H →</span>
            <div class="color-dots">
                <div class="color-dot active" data-color="red"    title="红色" style="background:#ff4444;"></div>
                <div class="color-dot" data-color="yellow" title="黄色" style="background:#ffcc00;"></div>
                <div class="color-dot" data-color="green"  title="绿色" style="background:#44dd88;"></div>
                <div class="color-dot" data-color="blue"   title="蓝色" style="background:#2196f3;"></div>
                <div class="color-dot" data-color="purple" title="紫色" style="background:#9b59b6;"></div>
                <div class="color-dot" data-color="black"  title="黑色" style="background:#000000;"></div>
            </div>
        </div>

        <div class="divider-vertical"></div>

        <label class="checkbox-container">
            <span class="checkbox-label">隐藏 H / 彩球</span>
            <div class="checkbox-custom"></div>
        </label>
    </div>
<script>

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 7);
        camera.lookAt(0, 0.1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.domElement.style.touchAction = 'none';
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.target.set(0, 0.1, 0);
        controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
        controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
        controls.update();

        // --- 光源（保留原 5 个） ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.65));

        const light1 = new THREE.PointLight(0xffffff, 1);
        light1.position.set(6, 5, 6);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xffffff, 0.5);
        light2.position.set(-5, 3, 4);
        scene.add(light2);

        const light3 = new THREE.PointLight(0xffffff, 0.4);
        light3.position.set(3, 2, -7);
        scene.add(light3);

        const light4 = new THREE.PointLight(0xffffff, 0.3);
        light4.position.set(0, -4, 3);
        scene.add(light4);

        scene.add(new THREE.HemisphereLight(0xffffff, 0xeeeeee, 0.6));

        // ============================================================
        // 原子半径（保持 C=0.32, H=0.18 原值；彩球 0.22，比 H 稍大、比 C 小）
        // ============================================================
        const RADII = { C: 0.32, H: 0.18, colored: 0.22 };
        const bondRadius = 0.065;
        const bondColor = 0x555555;

        // --- 几何位置（保持原值） ---
        const cPos = [
            new THREE.Vector3( 1.60,  0.10,  0.00),
            new THREE.Vector3( 0.90,  0.10,  1.30),
            new THREE.Vector3(-0.90,  0.10,  1.30),
            new THREE.Vector3(-1.60,  0.10,  0.00),
            new THREE.Vector3(-0.90, -0.70, -1.30),
            new THREE.Vector3( 0.90,  0.70, -1.30)
        ];

        const doubleBondLength = new THREE.Vector3().subVectors(cPos[1], cPos[0]).length();
        const chBondLength = doubleBondLength * 0.65;

        const v12 = new THREE.Vector3().subVectors(cPos[1], cPos[0]).normalize();
        const angle1 = -120 * Math.PI / 180;
        const h1Dir = new THREE.Vector3(
            v12.x * Math.cos(angle1) - v12.z * Math.sin(angle1),
            0,
            v12.x * Math.sin(angle1) + v12.z * Math.cos(angle1)
        ).normalize();
        const h1 = cPos[0].clone().add(h1Dir.multiplyScalar(chBondLength));
        h1.y = 0.10;

        const v43 = new THREE.Vector3().subVectors(cPos[2], cPos[3]).normalize();
        const angle4 = 120 * Math.PI / 180;
        const h4Dir = new THREE.Vector3(
            v43.x * Math.cos(angle4) - v43.z * Math.sin(angle4),
            0,
            v43.x * Math.sin(angle4) + v43.z * Math.cos(angle4)
        ).normalize();
        const h4 = cPos[3].clone().add(h4Dir.multiplyScalar(chBondLength));
        h4.y = 0.10;

        const v21 = new THREE.Vector3().subVectors(cPos[0], cPos[1]).normalize();
        const v23 = new THREE.Vector3().subVectors(cPos[2], cPos[1]).normalize();
        const h2Dir = new THREE.Vector3().addVectors(v21, v23).normalize().negate();
        const h2 = cPos[1].clone().add(h2Dir.multiplyScalar(chBondLength));
        h2.y = 0.10;

        const v32 = new THREE.Vector3().subVectors(cPos[1], cPos[2]).normalize();
        const v34 = new THREE.Vector3().subVectors(cPos[3], cPos[2]).normalize();
        const h3Dir = new THREE.Vector3().addVectors(v32, v34).normalize().negate();
        const h3 = cPos[2].clone().add(h3Dir.multiplyScalar(chBondLength));
        h3.y = 0.10;

        const v54 = new THREE.Vector3().subVectors(cPos[3], cPos[4]);
        const v56 = new THREE.Vector3().subVectors(cPos[5], cPos[4]);
        const v54n = v54.clone().normalize();
        const v56n = v56.clone().normalize();
        const cosTarget = Math.cos(109.5 * Math.PI / 180);
        const normal5 = new THREE.Vector3().crossVectors(v54, v56).normalize();
        const dot56 = v54n.dot(v56n);
        const a = cosTarget / (1 + dot56);
        const cSq = 1 - 2 * a * a * (1 + dot56);
        const c = Math.sqrt(Math.max(0, cSq));

        const h5aDir = new THREE.Vector3().addVectors(
            v54n.clone().multiplyScalar(a),
            v56n.clone().multiplyScalar(a)
        ).add(normal5.clone().multiplyScalar(c)).normalize();
        const h5bDir = new THREE.Vector3().addVectors(
            v54n.clone().multiplyScalar(a),
            v56n.clone().multiplyScalar(a)
        ).add(normal5.clone().multiplyScalar(-c)).normalize();

        const h5a = cPos[4].clone().add(h5aDir.multiplyScalar(chBondLength));
        const h5b = cPos[4].clone().add(h5bDir.multiplyScalar(chBondLength));

        const v61 = new THREE.Vector3().subVectors(cPos[0], cPos[5]);
        const v65 = new THREE.Vector3().subVectors(cPos[4], cPos[5]);
        const v61n = v61.clone().normalize();
        const v65n = v65.clone().normalize();
        const dot61 = v61n.dot(v65n);
        const normal6 = new THREE.Vector3().crossVectors(v61, v65).normalize();
        const a6 = cosTarget / (1 + dot61);
        const cSq6 = 1 - 2 * a6 * a6 * (1 + dot61);
        const c6 = Math.sqrt(Math.max(0, cSq6));

        const h6aDir = new THREE.Vector3().addVectors(
            v61n.clone().multiplyScalar(a6),
            v65n.clone().multiplyScalar(a6)
        ).add(normal6.clone().multiplyScalar(c6)).normalize();
        const h6bDir = new THREE.Vector3().addVectors(
            v61n.clone().multiplyScalar(a6),
            v65n.clone().multiplyScalar(a6)
        ).add(normal6.clone().multiplyScalar(-c6)).normalize();

        const h6a = cPos[5].clone().add(h6aDir.multiplyScalar(chBondLength));
        const h6b = cPos[5].clone().add(h6bDir.multiplyScalar(chBondLength));

        const hPositions = [h1, h2, h3, h4, h5a, h5b, h6a, h6b];
        const hParentIndex = [0, 1, 2, 3, 4, 4, 5, 5];

        const bonds = [
            { i: 0, j: 1, type: 'double' },
            { i: 1, j: 2, type: 'single' },
            { i: 2, j: 3, type: 'double' },
            { i: 3, j: 4, type: 'single' },
            { i: 4, j: 5, type: 'single' },
            { i: 5, j: 0, type: 'single' }
        ];

        // --- 材质（保持原样） ---
        const carbonMaterial = new THREE.MeshStandardMaterial({
            color: 0x000000, roughness: 0.3, metalness: 0.05
        });
        const hydrogenMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a2b5c, roughness: 0.35, metalness: 0.05
        });
        const bondMaterial = new THREE.MeshStandardMaterial({
            color: bondColor, roughness: 0.5, metalness: 0.1
        });

        // 6 色材质
        const COLOR_VALUES = {
            red:    0xff4444,
            yellow: 0xffcc00,
            green:  0x44dd88,
            blue:   0x2196f3,
            purple: 0x9b59b6,
            black:  0x000000
        };
        const coloredMaterials = {};
        Object.keys(COLOR_VALUES).forEach(key => {
            coloredMaterials[key] = new THREE.MeshStandardMaterial({
                color: COLOR_VALUES[key], roughness: 0.35, metalness: 0.1
            });
        });

        const sphereGeomC = new THREE.SphereGeometry(RADII.C, 32, 16);
        const sphereGeomH = new THREE.SphereGeometry(RADII.H, 24, 12);
        const sphereGeomColored = new THREE.SphereGeometry(RADII.colored, 24, 12);

        // 通用：圆柱键（返回 mesh）
        function addCylinderBetween(p1, p2, radius, material, parent) {
            const start = p1.clone();
            const end = p2.clone();
            const direction = new THREE.Vector3().subVectors(end, start);
            const length = direction.length();
            const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 10), material);
            const midPoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
            cylinder.position.copy(midPoint);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
            parent.add(cylinder);
            return cylinder;
        }

        function addDoubleBond(p1, p2, radius, material, parent, offset = 0.14) {
            const start = p1.clone();
            const end = p2.clone();
            const dir = new THREE.Vector3().subVectors(end, start).normalize();
            let perp = new THREE.Vector3(1, 0, 0);
            if (Math.abs(dir.dot(perp)) > 0.99) perp = new THREE.Vector3(0, 1, 0);
            const axis = new THREE.Vector3().crossVectors(dir, perp).normalize();
            const offsetVec = axis.clone().multiplyScalar(offset);
            addCylinderBetween(start.clone().add(offsetVec), end.clone().add(offsetVec), radius, material, parent);
            addCylinderBetween(start.clone().sub(offsetVec), end.clone().sub(offsetVec), radius, material, parent);
        }

        const moleculeGroup = new THREE.Group();
        scene.add(moleculeGroup);

        // --- 碳-碳键 ---
        bonds.forEach(bond => {
            const p1 = cPos[bond.i];
            const p2 = cPos[bond.j];
            if (bond.type === 'single') {
                addCylinderBetween(p1, p2, bondRadius, bondMaterial, moleculeGroup);
            } else {
                addDoubleBond(p1, p2, bondRadius * 0.9, bondMaterial, moleculeGroup, 0.13);
            }
        });

        // --- 碳原子 ---
        cPos.forEach(pos => {
            const sphere = new THREE.Mesh(sphereGeomC, carbonMaterial);
            sphere.position.copy(pos);
            moleculeGroup.add(sphere);
        });

        // ============================================================
        // 可替换原子管理（8 个 H + 对应的 C-H 键）
        // ============================================================
        const clickableAtoms = [];
        const switchableAtoms = [];

        hPositions.forEach((hPos, idx) => {
            const carbonIdx = hParentIndex[idx];
            const cPosVal = cPos[carbonIdx];

            const hMesh = new THREE.Mesh(sphereGeomH, hydrogenMaterial);
            hMesh.position.copy(hPos);
            moleculeGroup.add(hMesh);
            clickableAtoms.push(hMesh);

            const bond = addCylinderBetween(cPosVal, hPos, bondRadius * 0.9, bondMaterial, moleculeGroup);

            switchableAtoms.push({
                mesh: hMesh,
                bond,
                cPos: cPosVal.clone(),
                hPos: hPos.clone(),
                type: 'H',
                colorKey: null
            });
        });

        // ============================================================
        // 隐藏 H 复选框
        // ============================================================
        const checkboxContainer = document.querySelector('.checkbox-container');
        const checkboxCustom = document.querySelector('.checkbox-custom');
        let isHidden = false;

        function toggleHydrogen(hide) {
            isHidden = hide;
            switchableAtoms.forEach(rec => {
                rec.mesh.visible = !hide;
                rec.bond.visible = !hide;
            });
            checkboxCustom.classList.toggle('checked', hide);
        }

        checkboxContainer.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleHydrogen(!isHidden);
        });

        // ============================================================
        // 颜色选择器
        // ============================================================
        let selectedColorKey = 'red';
        const colorDots = document.querySelectorAll('.color-dot');
        colorDots.forEach(dot => {
            dot.addEventListener('click', () => {
                selectedColorKey = dot.dataset.color;
                colorDots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
            });
        });

        // ============================================================
        // 原子替换
        // ============================================================
        function swapAtom(record, newType, colorKey) {
            moleculeGroup.remove(record.mesh);
            moleculeGroup.remove(record.bond);

            const ci = clickableAtoms.indexOf(record.mesh);
            if (ci > -1) clickableAtoms.splice(ci, 1);

            let newMesh;
            if (newType === 'H') {
                newMesh = new THREE.Mesh(sphereGeomH, hydrogenMaterial);
            } else {
                newMesh = new THREE.Mesh(sphereGeomColored, coloredMaterials[colorKey]);
            }
            newMesh.position.copy(record.hPos);
            newMesh.visible = !isHidden;
            moleculeGroup.add(newMesh);
            clickableAtoms.push(newMesh);

            const newBond = addCylinderBetween(record.cPos, record.hPos, bondRadius * 0.9, bondMaterial, moleculeGroup);
            newBond.visible = !isHidden;

            record.mesh = newMesh;
            record.bond = newBond;
            record.type = newType;
            record.colorKey = newType === 'H' ? null : colorKey;
        }

        // ============================================================
        // 拾取：射线优先，触屏 45px 屏幕空间 fallback
        // ============================================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function doPick(clientX, clientY, pointerType) {
            if (isHidden) return; // 隐藏状态下不响应

            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const visibleClickable = clickableAtoms.filter(a => a.visible);
            const intersects = raycaster.intersectObjects(visibleClickable, false);

            let hitMesh = null;
            if (intersects.length > 0) {
                hitMesh = intersects[0].object;
            } else if (pointerType !== 'mouse') {
                // 触屏 fallback：屏幕空间 45px 内最近的可点击原子
                const v = new THREE.Vector3();
                let best = null, bestDist = 45;
                visibleClickable.forEach(atom => {
                    atom.getWorldPosition(v);
                    v.project(camera);
                    if (v.z < -1 || v.z > 1) return;
                    const sx = (v.x + 1) * 0.5 * window.innerWidth;
                    const sy = (-v.y + 1) * 0.5 * window.innerHeight;
                    const d = Math.sqrt((sx - clientX) ** 2 + (sy - clientY) ** 2);
                    if (d < bestDist) { bestDist = d; best = atom; }
                });
                if (best) hitMesh = best;
            }

            if (!hitMesh) return;

            const record = switchableAtoms.find(r => r.mesh === hitMesh);
            if (!record) return;

            if (record.type === 'H') {
                swapAtom(record, 'colored', selectedColorKey);
            } else {
                swapAtom(record, 'H');
            }
        }

        // ============================================================
        // 触屏 / 鼠标 点击识别（三段式）
        // ============================================================
        const activePointers = new Set();
        let pointerDownInfo = null;

        renderer.domElement.addEventListener('pointerdown', (e) => {
            activePointers.add(e.pointerId);
            if (activePointers.size === 1) {
                pointerDownInfo = {
                    x: e.clientX, y: e.clientY,
                    t: performance.now(),
                    pointerType: e.pointerType || 'touch',
                    id: e.pointerId
                };
            } else {
                pointerDownInfo = null;
            }
        });

        renderer.domElement.addEventListener('pointermove', (e) => {
            if (!pointerDownInfo || pointerDownInfo.id !== e.pointerId || activePointers.size !== 1) return;
            const dx = e.clientX - pointerDownInfo.x;
            const dy = e.clientY - pointerDownInfo.y;
            const thr = pointerDownInfo.pointerType === 'mouse' ? 6 : 12;
            if (dx * dx + dy * dy > thr * thr) pointerDownInfo = null;
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            const countBeforeUp = activePointers.size;
            if (pointerDownInfo && pointerDownInfo.id === e.pointerId && countBeforeUp === 1) {
                const dx = e.clientX - pointerDownInfo.x;
                const dy = e.clientY - pointerDownInfo.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const dt = performance.now() - pointerDownInfo.t;
                const thr = pointerDownInfo.pointerType === 'mouse' ? 6 : 12;
                if (dist <= thr && dt <= 500) {
                    doPick(e.clientX, e.clientY, pointerDownInfo.pointerType);
                }
            }
            activePointers.delete(e.pointerId);
            if (activePointers.size === 0) pointerDownInfo = null;
        });

        renderer.domElement.addEventListener('pointercancel', (e) => {
            activePointers.delete(e.pointerId);
            if (activePointers.size === 0) pointerDownInfo = null;
        });
        window.addEventListener('pointerup', (e) => {
            activePointers.delete(e.pointerId);
            if (activePointers.size === 0) pointerDownInfo = null;
        });
        window.addEventListener('pointercancel', (e) => {
            activePointers.delete(e.pointerId);
            if (activePointers.size === 0) pointerDownInfo = null;
        });
        window.addEventListener('blur', () => {
            activePointers.clear();
            pointerDownInfo = null;
        });

        // iOS Safari 页面级双指缩放拦截
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(evtName => {
            document.addEventListener(evtName, (e) => e.preventDefault(), { passive: false });
        });

        // 控制面板阻止事件冒泡到 canvas
        const controlsPanel = document.getElementById('controls');
        controlsPanel.addEventListener('pointerdown', (e) => e.stopPropagation());
        controlsPanel.addEventListener('pointermove', (e) => e.stopPropagation());

        // ============================================================
        // 相机自适应（横竖屏 / 窄屏）
        //   内容：C 环（x: ±1.6, z: ±1.3）+ C-H 键 + H 半径 ≈ 5×4
        //   加边距取 6×5
        // ============================================================
        function updateCameraZoom() {
            const aspect = window.innerWidth / window.innerHeight;
            const dist = camera.position.distanceTo(controls.target);
            const fovRad = THREE.MathUtils.degToRad(camera.fov / 2);
            const baseVisibleH = 2 * dist * Math.tan(fovRad);
            const baseVisibleW = baseVisibleH * aspect;

            const contentW = 6;
            const contentH = 5;

            const zoomForW = baseVisibleW / contentW;
            const zoomForH = baseVisibleH / contentH;

            const isLandscape = aspect > 1;
            const maxZoom = isLandscape ? 1.0 : 0.95;
            const minZoom = isLandscape ? 0.55 : 0.30;

            camera.zoom = Math.max(minZoom, Math.min(maxZoom, zoomForW, zoomForH));
            camera.updateProjectionMatrix();
        }
        updateCameraZoom();

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 窗口 / 屏幕变化 ---
        let resizeTimer = null;
        function onWindowResize() {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                updateCameraZoom();
            }, 60);
        }
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 300));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', onWindowResize);
        }
    </script>
